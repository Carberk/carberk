if(['accept','receipt','agreeRecovery','refuse'].includes(action)&&!s.active)return fail('deniedStaff');
if(action==='accept'){if(!['quote','late'].includes(o.status))return fail('deniedStatus');if(o.status==='late')return fail('deniedExpired');if(s.now>=o.promise)return fail('deniedPromise');if((s.slots[o.quoteDay]||0)<1)return fail('deniedFull');o.hold=true;o.holdEnd=s.now+120;s.slots[o.quoteDay]--;o.status='awaiting';return done('okAccept')}
if(action==='receipt'){if(!['awaiting','expired','late','review'].includes(o.status))return fail('deniedStatus');o.claim=true;o.status=o.hold?'review':'late';return done('okReceipt')}
if(action==='agreeRecovery'){if(o.status!=='escalated')return fail('deniedStatus');o.recovery=addStaffHour(s.now);o.status='recovering';return done('okRecovery')}
if(action==='refuse'){if(!['escalated','late'].includes(o.status))return fail('deniedStatus');o.status='refund';return done('okRefund')}
if(action==='approve'){if(s.access!=='founder')return fail('deniedFounder');if(o.status!=='refund')return fail('deniedStatus');o.status='approved';return done('okApproved')}
if(action==='returned'){if(s.access!=='founder')return fail('deniedFounder');if(o.status!=='approved')return fail('deniedStatus');o.status='refunded';return done('okReturned')}
if(action==='claim'){if(!s.active||s.access!=='operator'||(o.owner&&o.owner!==s.actor))return fail('deniedStaff');o.owner=s.actor;return done('okClaim')}
if(!staff(s,o))return fail('deniedStaff');
if(action==='fastQuote'){if(!['enquiry','expired'].includes(o.status)||!staffed(s))return fail('deniedStatus');if((s.slots[day(s)]||0)<1)return fail('deniedFull');o.quoteDay=day(s);o.promise=day(s)*1440+1200;o.status='quote';return done('okQuote')}
if(action==='quote'){if(!['enquiry','expired'].includes(o.status))return fail('deniedStatus');const b=booking(s);if(!b)return fail('deniedFull');o.quoteDay=b.day;o.promise=b.promise;o.status='quote';return done('okQuote')}
if(action==='agreeDay'){if(o.status!=='late'||!o.claim)return fail('deniedStatus');const b=booking(s);if(!b)return fail('deniedFull');o.quoteDay=b.day;o.promise=b.promise;o.hold=true;o.holdEnd=s.now+120;s.slots[b.day]--;o.status='review';return done('okLate')}
if(action==='confirm'){if(!o.claim||!['review','late'].includes(o.status))return fail('deniedStatus');if(!staffed(s))return fail('deniedHours');if(!o.hold||o.holdEnd<=s.now)return fail('deniedExpired');if(o.promise<=s.now)return fail('deniedPromise');o.paid=true;o.confirmedAt=s.now;o.status='paid';return done('okPaid')}
if(action==='purchase'||action==='reuse'){if(!o.paid||!['paid','recovering'].includes(o.status))return fail('deniedStatus');if(fifo(s)[0]?.id!==o.id)return fail('deniedFifo');o.status=action==='reuse'?'ready':'ready';o.sourceDate=action==='reuse'?'2026-10-01':'2026-10-14';s.archiveOpen=action==='reuse';return done(action==='reuse'?'okArchive':'okPrepared')}
if(action==='deliver'){if(o.status!=='ready')return fail('deniedStatus');o.status='delivered';return done('okDelivered')}
if(action==='handover'){o.owner='Maksat';return done('okHandover')}
return fail('deniedStatus')}
const setupPaid=(o,at,promise)=>Object.assign(o,{status:'paid',paid:true,claim:true,confirmedAt:at,promise,quoteDay:Math.floor(promise/1440),hold:true});
const guides={
 fifo:{name:'gFifo',setup:s=>{setupPaid(s.orders[0],s.now,s.now+60);s.orders.splice(1,0,setupPaid(baseOrder('R0','B'),s.now-30,s.now+60));},steps:[['purchase','purchase'],['selected','select','R0'],['purchase','purchase'],['deliver','deliver'],['selected','select','R1'],['purchase','purchase'],['deliver','deliver']]},
 expiry:{name:'gExpire',steps:[['offerQuote','quote'],['accept','accept'],['receipt','receipt'],['advance120','advance',120],['confirm','confirm'],['agreeDay','agreeDay'],['confirm','confirm'],['purchase','purchase'],['deliver','deliver']]},
 refuse:{name:'gRefuse',setup:s=>setupPaid(s.orders[0],s.now,s.now+60),steps:[['advance60','advance',60],['refuse','refuse'],['founder','actor',['Founder','founder',true]],['approve','approve'],['returnFunds','returned']]},
 recovery:{name:'gRecover',setup:s=>setupPaid(s.orders[0],s.now,s.now+60),steps:[['advance60','advance',60],['agreeRecovery','agreeRecovery'],['advance60','advance',60],['founder','actor',['Founder','founder',true]],['approve','approve'],['returnFunds','returned']]},
 closing:{name:'gClose',setup:s=>s.now=14*1440+1170,steps:[['offerQuote','quote'],['accept','accept'],['advance60','advance',60],['receipt','receipt'],['confirm','confirm'],['nextNine','nextNine'],['agreeDay','agreeDay'],['confirm','confirm'],['advance60','advance',60]]},
 morning:{name:'gMorning',setup:s=>{s.now=14*1440+1170;s.slots[14]=0;s.orders.push(baseOrder('R2'),baseOrder('R3'))},steps:[['offerQuote','quote'],['accept','accept'],['selected','select','R2'],['offerQuote','quote'],['accept','accept'],['selected','select','R3'],['offerQuote','quote']]},
 feasible:{name:'gFeasible',setup:s=>s.now=14*1440+1170,steps:[['fastQuote','fastQuote'],['accept','accept'],['receipt','receipt'],['confirm','confirm'],['advance30','advance',30],['agreeRecovery','agreeRecovery']]},
 capacity:{name:'gCapacity',setup:s=>{s.slots[14]=0;s.slots[15]=0},steps:[['offerQuote','quote'],['receipt','receipt']]},
 access:{name:'gAccess',setup:s=>setupPaid(s.orders[0],s.now,s.now+60),steps:[['read','read'],['handover','handover'],['confirm','confirm'],['read','read'],['other','actor',['Maksat','operator',true]],['read','read'],['buyerB','actor',['B','customer',true]],['read','read'],['buyerA','actor',['A','customer',true]],['read','read'],['disabled','actor',['Ayna','operator',false]],['read','read']]},
 archive:{name:'gArchive',setup:s=>setupPaid(s.orders[0],s.now,s.now+60),steps:[['reuse','reuse'],['historical','historical'],['founder','actor',['Founder','founder',true]],['historical','historical'],['staff','actor',['Ayna','operator',true]],['deliver','deliver'],['buyerB','actor',['B','customer',true]],['read','read']]}}
let model=initial();function start(id){model=initial();model.guide=id;guides[id].setup?.(model);render()}
function act(a,v){model=change(model,a,v);render()}
function next(){const g=guides[model.guide];if(model.step>=g.steps.length)return;const [,a,v]=g.steps[model.step];model=change(model,a,v);model.step++;render()}
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=n=>n==null?t('none'):`${Math.floor(n/1440)} ${t('date')} ${String(Math.floor(n%1440/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const val=(k,v)=>`<div><div class="label">${t(k)}</div><div class="value">${e(v)}</div></div>`;
function render(){document.documentElement.lang=locale;document.getElementById('subtitle').textContent=t('subtitle');document.getElementById('localeLabel').textContent=t('locale');document.getElementById('back').textContent=t('back');const s=model,o=current(s),g=guides[s.guide];const allowed=s.access==='founder'||staff(s,o)||(s.access==='customer'&&s.actor===o.buyer);const btn=(label,a,v)=>`<button onclick='act(${JSON.stringify(a)},${JSON.stringify(v??null)})'>${t(label)}</button>`;const staffOptions=[['Ayna','operator',true,'staff'],['Maksat','operator',true,'other'],['Founder','founder',true,'founder'],['A','customer',true,'buyerA'],['B','customer',true,'buyerB'],['Ayna','operator',false,'disabled']];
const table=orders=>`<div class="scroll"><table><thead><tr><th>${t('selected')}</th><th>${t('status')}</th><th>${t('verified')}</th><th>${t('promise')}</th></tr></thead><tbody>${orders.map(x=>`<tr><td><button onclick="act('select','${x.id}')">${x.id}</button></td><td>${t(x.status)}</td><td>${time(x.confirmedAt)}</td><td>${time(x.promise)}</td></tr>`).join('')}</tbody></table></div>`;
document.getElementById('app').innerHTML=`<h1>${t('title')}</h1><p>${t('intro')}</p><p class="notice">${t('limits')}</p><section class="panel guide"><h2>${t('guides')}</h2><div class="row">${Object.entries(guides).map(([id,x])=>`<button class="${s.guide===id?'active':''}" onclick="start('${id}')">${t(x.name)}</button>`).join('')}</div><p>${t('guideDesc')}</p><div class="row"><button class="primary" id="next" onclick="next()" ${s.step>=g.steps.length?'disabled':''}>${s.step<g.steps.length?`${s.step+1}/${g.steps.length} · ${t(g.steps[s.step][0])}`:t('complete')}</button><button onclick="start('${s.guide}')">${t('restart')}</button></div></section><div id="feedback" role="status" aria-live="polite">${t(s.feedback)}</div><div class="cards panel">${val('clock',time(s.now))+val('hours',t('hours'))+val('actor',t(staffOptions.find(x=>x[0]===s.actor&&x[1]===s.access&&x[2]===s.active)?.[3]||'staff'))}<div><label for="actor">${t('actor')}</label><select id="actor" onchange="act('actor',JSON.parse(this.value))">${staffOptions.map(x=>`<option value='${JSON.stringify(x.slice(0,3))}' ${s.actor===x[0]&&s.access===x[1]&&s.active===x[2]?'selected':''}>${t(x[3])}</option>`).join('')}</select></div>${val('today',String(s.slots[day(s)]||0))+val('tomorrow',String(s.slots[day(s)+1]||0))}</div><p class="label">${t('capNote')}</p><div class="grid"><section class="panel"><h2>${t('selected')}: ${o.id}</h2>${allowed?`<div class="cards">${val('status',t(o.status))+val('owner',o.owner||t('unassigned'))+val('vin',o.vin)+val('promise',time(o.promise))+val('hold',o.hold?time(o.holdEnd):t('none'))+val('recovery',time(o.recovery))+val('received',t(o.claim?'yes':'no'))+val('verified',time(o.confirmedAt))}</div>`:`<p class="denied">${t('denied')}</p>`}<p>${t('offer')}</p><h2>${t('free')}</h2><div class="actions">${[['claim','claim'],['offerQuote','quote'],['fastQuote','fastQuote'],['accept','accept'],['receipt','receipt'],['confirm','confirm'],['agreeDay','agreeDay'],['purchase','purchase'],['deliver','deliver'],['agreeRecovery','agreeRecovery'],['refuse','refuse'],['approve','approve'],['returnFunds','returned'],['handover','handover'],['reuse','reuse'],['read','read'],['historical','historical']].map(([l,a])=>btn(l,a)).join('')}${btn('advance30','advance',30)}${btn('advance60','advance',60)}${btn('advance120','advance',120)}${btn('nextNine','nextNine')}</div></section><section class="panel"><h2>${t('queue')}</h2><p class="label">${t('queueNote')}</p>${s.active&&s.access!=='customer'?table(fifo(s)):t('denied')}<h2 style="margin-top:20px">${t('questions')}</h2>${s.active&&s.access!=='customer'?table(s.orders.filter(x=>!x.paid)):t('denied')}<h2 style="margin-top:20px">${t('private')}</h2><p class="label">${t('privateNote')}</p>${s.privateOpen&&allowed?`<div class="notice">${t('record')} ${o.buyer}: ${t('chatData')}<p>${o.claim?t('receiptData'):t('none')}</p></div>`:`<p class="denied">${t('denied')}</p>`}${s.historicalOpen&&s.access==='founder'?`<div class="notice">${t('historical')}: ${t('receiptData')}</div>`:''}</section></div>${s.archiveOpen&&allowed?`<section class="panel"><h2>${t('archive')}</h2><p>Carfax · ${e(o.vin)} · ${e(o.sourceDate)}</p><p>${t('archiveNote')}</p></section>`:''}<details class="panel" open><summary>${t('state')}</summary><div class="cards">${val('selected',o.id)+val('clock',time(s.now))+(allowed?val('status',t(o.status))+val('verified',time(o.confirmedAt))+val('promise',time(o.promise))+val('recovery',time(o.recovery)):val('private',t('denied')))}</div><h2>${t('audit')}</h2><div class="timeline">${s.audit.filter(x=>s.active&&s.access!=='customer'||x.actor===s.actor).slice(0,15).map(x=>`<p>${time(x.at)} · ${e(x.order)} · ${e(x.actor)}<br>${t(x.code)}</p>`).join('')}</div></details><footer>${t('limits')}</footer>`;}
start('fifo');
</script></body></html>
