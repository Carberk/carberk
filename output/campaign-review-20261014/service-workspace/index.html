een;gap:15px;margin-bottom:22px;align-items:center}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:0 1 auto}.row input{flex:1;min-width:130px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:20px}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:9px;background:white;margin-bottom:24px}.stats button{border:0;border-right:1px solid var(--line);text-align:left;border-radius:0;padding:18px}.stats button:last-child{border-right:0}.stats strong{display:block;font-size:27px;margin-top:4px;font-variant-numeric:tabular-nums}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--muted);font-weight:500;background:#f6f7f8}td,th{padding:13px 12px;border-bottom:1px solid var(--line)}td button{min-height:36px;padding:5px 9px}td.vin{font-size:12px;letter-spacing:.02em}.table{overflow:auto}.badge{display:inline-block;background:#edf0f3;color:#414951;border-radius:5px;padding:3px 7px;font-size:12px;white-space:nowrap}.badge.green{background:#e6f2eb;color:var(--good)}.badge.amber{background:#fff0d5;color:var(--warn)}.badge.red{background:#fbe8eb;color:#a01d29}.work{display:grid;grid-template-columns:245px minmax(300px,1fr) 285px;border:1px solid var(--line);background:white;border-radius:10px;overflow:hidden;min-height:630px}.queue{border-right:1px solid var(--line);padding:12px}.queue button{text-align:left;width:100%;border:0;border-radius:7px;margin-top:6px;padding:13px}.queue button.selected{background:#f9e9eb}.queue button strong{display:block;margin-bottom:3px}.thread{display:flex;flex-direction:column;min-width:0}.threadhead{padding:18px;border-bottom:1px solid var(--line)}.messages{padding:18px;flex:1;min-height:280px;max-height:410px;overflow:auto}.msg{padding:11px 13px;background:#f0f2f4;border-radius:8px;margin-bottom:12px;max-width:88%;overflow-wrap:anywhere}.msg.staff{margin-left:auto;background:#f9e9eb}.msg.system{max-width:100%;background:#fff8e8;font-size:12px;color:#624b24}.msg small{display:block;margin-bottom:3px}.compose{padding:16px;border-top:1px solid var(--line)}.context{border-left:1px solid var(--line);padding:18px;background:#fbfbfc}.context section{margin-bottom:22px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}.stack>*{margin-bottom:9px}.stack button{width:100%;text-align:left}.state{margin-top:20px;background:#fff;border:1px dashed #b9bec5;padding:14px;border-radius:8px}.state summary{cursor:pointer;font-weight:600}.stategrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.stategrid small{display:block}.notice{padding:11px 13px;background:#fff5df;border:1px solid #ead5a2;border-radius:7px;margin:12px 0}.timeline{padding-left:18px;border-left:1px solid #cbd0d5}.timeline p{margin-bottom:17px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:#202326;color:white}.phone{max-width:430px;margin:auto;border:1px solid #d4d7db;border-radius:18px;overflow:hidden;background:white;min-height:650px}.phone .inside{padding:22px}.phone h1{font-size:25px}.phone .messages{max-height:290px;min-height:160px}.service{background:#fbf0f1;border:1px solid #e9c9cc;border-radius:9px;padding:18px;margin:18px 0}.service button{margin-top:6px}.listinghero{display:flex;align-items:center;justify-content:center;min-height:190px;background:#edf0f3;border-radius:7px;color:#5d6269;margin-bottom:16px;text-align:center}.thumbs{display:flex;gap:8px;margin-bottom:20px}.thumbs span{padding:15px;background:#f0f2f4;border:1px solid var(--line);border-radius:5px}.feedback{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#202326;color:white;padding:12px 20px;border-radius:8px;max-width:85vw;z-index:10}.guided{padding:16px 20px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-top:20px}.guided p{margin:8px 0}.empty{padding:35px;text-align:center;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;padding:25px;max-width:600px;width:90%}dialog::backdrop{background:#20232670}a{color:#ac1f2d}::selection{background:#f1bac1}.hidden{display:none}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:12px;padding:7px 10px}footer{font-size:12px;padding:16px;color:var(--muted)}
@media(max-width:1200px){.work{grid-template-columns:210px minmax(280px,1fr)}.context{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:18px}.context section{margin:0}.shell{grid-template-columns:160px 1fr}.content{padding:18px}.split{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.shell{display:block}nav{display:flex;overflow:auto;padding:8px;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto;margin:0}nav hr,nav small{display:none}.work{grid-template-columns:1fr}.queue{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.queue button{min-width:180px}.queue input,.queue h3{display:none}.context{display:block}.context section{margin-bottom:20px}.heading{align-items:flex-start}.stategrid{grid-template-columns:1fr 1fr}.bar{padding:10px 14px}.lab{padding:10px 14px}.content{padding:14px}h1{font-size:23px}.stats button{padding:12px}.heading .row{justify-content:flex-end}}
</style>
<body><header class="bar"><div class="brand">Carberk<span>.</span> <small>Service workspace</small></div><div class="row"><button onclick="setAudience('admin')" id="adminToggle">Admin workspace</button><button onclick="setAudience('customer')" id="customerToggle">Customer journey</button></div></header>
<div class="lab"><p><strong>Local prototype.</strong> Can one workspace handle Support, report orders and vehicle context? All records and actions are synthetic. Refresh resets everything.</p><button onclick="resetAll()">Reset demo</button></div><div class="notice" style="margin:18px 22px"><a href="commitments.prototype.html">Open the final commitment walkthrough · FIFO, late funds, deadlines, access · TK / RU / EN</a></div><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="preview"></dialog>
<script>
// Pure in-memory transition model. No provider, payment, storage or customer API calls.
const DEMO_VIN='WBADEMO00DEMO0001'; // Clearly synthetic, not suitable for provider lookup.
const initial=()=>({clock:10,day:14,freeToday:2,freeTomorrow:3,actor:'Ayna',role:'operator',audience:'admin',view:'overview',filter:'all',selected:'r1',customerPage:'home',scenario:'sale',step:0,feedback:'',archive:[{id:'a1',vin:DEMO_VIN,provider:'Carfax',date:'10 Oct 2026',mileage:'81,200 km',source:'Earlier synthetic check'}],audit:[],cases:[{id:'r1',kind:'history',name:'Merdan A.',title:'BMW 530i · 2018',vin:DEMO_VIN,listing:'l1',status:'enquiry',assignee:null,eligible:false,accepted:false,paid:false,hold:false,due:'Today, within one staffed hour',sources:[],messages:[{by:'customer',text:'Can you check this car before I buy it?'}],notes:[]},{id:'r2',kind:'history',name:'Selbi B.',title:'Toyota Camry · 2020',vin:'DEMO VIN · CAMRY',listing:'l2',status:'payment review',assignee:'Maksat',eligible:true,accepted:true,paid:false,hold:true,due:'Today, 11:30',sources:[],messages:[{by:'customer',text:'I sent the payment. Here is my receipt.'},{by:'system',text:'Synthetic receipt received. Funds have not been confirmed.'}],notes:[]},{id:'s1',kind:'support',name:'Dovlet K.',title:'My listing is not visible',status:'open',assignee:null,messages:[{by:'customer',text:'I published my car, but I cannot find it in search.'}],notes:[]}]});
const clone=x=>JSON.parse(JSON.stringify(x));
function transition(state,action,value){const s=clone(state),c=s.cases.find(c=>c.id===s.selected),staff=()=>c.assignee===s.actor;const fail=t=>{s.feedback=t;return s};const log=t=>{s.audit.unshift({time:`${s.clock}:00`,actor:s.actor,text:t});s.feedback=t};const msg=t=>c.messages.push({by:'system',text:t});
if(action==='claim'){if(c.assignee&&c.assignee!==s.actor)return fail('This request belongs to '+c.assignee+'. Use an explicit handover.');c.assignee=s.actor;log('Request assigned to '+s.actor)}
else if(action==='handover'){if(!staff())return fail('Only the assigned operator can hand this request over.');c.assignee=s.actor==='Ayna'?'Maksat':'Ayna';msg('Your operator is now '+c.assignee+'.');log('Explicit handover to '+c.assignee)}
else if(action==='reply'){if(!staff())return fail('Claim this request before replying.');if(!value.trim())return fail('Write a reply first.');c.messages.push({by:'staff',name:s.actor,text:value});log('Public reply sent in demo')}
else if(action==='note'){if(!staff())return fail('Claim this request before adding notes.');if(!value.trim())return fail('Write a private note first.');c.notes.push({by:s.actor,text:value});log('Private staff note added')}
else if(action==='vin'){if(c.kind!=='history'||c.paid||c.hold||c.accepted)return fail('The agreed VIN is locked. Ask your operator about a correction.');const vin=value.trim().toUpperCase();c.vin=vin;c.eligible=false;c.status='enquiry';msg('VIN submitted: '+vin+'. Your operator must check vehicle match and report availability before payment.');log('VIN submitted for review')}
else if(action==='eligibility'){if(!staff()||c.kind!=='history')return fail('The assigned report operator performs this check.');if(c.paid||c.hold||c.accepted)return fail('The agreed order is locked. Handle fulfilment or recovery without changing eligibility.');if(value==='available'&&c.vin!==DEMO_VIN&&!/^[A-HJ-NPR-Z0-9]{17}$/.test(c.vin||''))return fail('Enter a 17-character VIN without I, O or Q first. Format alone does not establish authenticity or provider availability.');c.eligible=value==='available';c.status=value==='available'?'eligible':value==='invalid'?'VIN correction needed':value==='mismatch'?'vehicle mismatch':value==='failure'?'provider unavailable':'no report available';msg(value==='available'?'Available history found. Please confirm this VIN matches your vehicle.':value==='invalid'?'Check the VIN against the vehicle and its documents. Do not pay yet.':value==='mismatch'?'The vehicle details do not match. Please verify the VIN. Do not pay yet.':value==='failure'?'We could not check availability. Your operator will try again. Do not pay yet.':'No history report is available through this service for this VIN. Do not pay.');log('Synthetic eligibility result: '+value)}
else if(action==='quote'){if(!staff()||!c.eligible||!['eligible','quote'].includes(c.status))return fail('Confirm report availability before quoting.');if(c.paid||c.hold)return fail('This request already has a booking or confirmed payment.');if(s.freeToday===0&&s.freeTomorrow===0)return fail('Today and tomorrow are full. Keep the enquiry open without requesting payment.');c.status='quote';c.quoteDay=s.freeToday>0?'today':'tomorrow';c.due=c.quoteDay==='today'?'Today, within one staffed hour':'Tomorrow, by 10:00';msg('100 TMT for Carfax or AutoCheck, both if available. VIN: '+c.vin+'. Delivery: '+c.due+'. Check the VIN carefully. One vehicle only. No cancellation after payment confirmation; failed delivery is reviewed for refund. Please confirm before paying.');log('Quote offered for '+c.quoteDay)}
else if(action==='accept'){if(c.status!=='quote')return fail('An eligible VIN and quote are needed first.');if((c.quoteDay==='today'?s.freeToday:s.freeTomorrow)<1)return fail('That day filled before acceptance. Ask the operator for a revised quote.');c.accepted=true;c.hold=true;c.holdEnd=s.clock+2;c.status='awaiting payment';if(c.quoteDay==='today')s.freeToday--;else s.freeTomorrow--;msg('VIN, 100 TMT price, delivery and rules accepted. A slot is held for two hours. Operator will provide external payment instructions. Demo contains no payment destination.');log('Customer accepted; two-hour slot hold started')}
else if(action==='receipt'){if(c.status!=='awaiting payment')return fail('Payment instructions are not active. Contact your operator if you already paid.');c.status='payment review';c.messages.push({by:'customer',text:'I paid. Please review my screenshot or sender phone number.'});msg('Receipt submitted. Payment is awaiting verification, not confirmed.');log('Customer payment claim recorded')}
else if(action==='confirm'){if(!staff()||c.status!=='payment review')return fail('Only the assigned operator can confirm a payment under review.');if(!c.hold)return fail('The booking expired. Reconcile payment and agree an available day or escalate refund.');c.paid=true;c.paidAt=s.audit.length;c.status='paid';msg('Your payment has been confirmed. Delivery: '+c.due+'.');log('Operator verified receipt of funds in demo')}
else if(action==='obtain'){if(!staff()||!c.paid||!['paid','reports ready'].includes(c.status))return fail('Confirm payment before obtaining reports.');if(value==='none'){c.status='delivery recovery';msg('We could not provide a report. Your operator is investigating and will agree a recovery deadline.');log('Provider failure escalated for recovery');return s}c.sources=value==='archive'?[clone(s.archive[0])]:value==='both'?['Carfax','AutoCheck'].map(p=>({id:c.id+'-'+p,vin:c.vin,provider:p,date:'14 Oct 2026',mileage:'81,900 km',source:'New synthetic check'})):[{id:c.id+'-'+value,vin:c.vin,provider:value,date:'14 Oct 2026',mileage:'81,900 km',source:'New synthetic check'}];c.status='reports ready';log(value==='archive'?'Existing dated report selected by operator':'Synthetic report acquisition completed')}
else if(action==='deliver'){if(!staff()||c.status!=='reports ready'||!c.sources.length)return fail('Prepare at least one usable report for the confirmed VIN first.');if(c.sources.some(r=>r.vin!==c.vin))return fail('Report VIN does not match. Correct it at Carberk cost or escalate refund.');c.status='delivered';for(const r of c.sources)if(!s.archive.some(a=>a.id===r.id))s.archive.push(clone(r));msg('Reports delivered. Open the documents below; you can download and share them. Original report dates remain visible.');log('Reports delivered and archived')}
else if(action==='failedUpload'){if(!staff()||!c.paid)return fail('Choose an assigned paid order.');c.status='delivery recovery';msg('Document delivery failed. We will retry and confirm a recovery deadline.');log('Delivery failed; recovery required')}
else if(action==='refund'){if(!staff()||!c.paid||c.status!=='delivery recovery')return fail('An assigned paid order must enter service-failure recovery before refund escalation.');c.status='refund approval';msg('Your case has been escalated for a refund decision. A request is not yet a completed refund.');log('Refund approval requested')}
else if(action==='approveRefund'){if(s.role!=='founder'||c.status!=='refund approval')return fail('Founder approval required.');c.status='refund approved';msg('Your refund is approved. External return of funds is being arranged.');log('Founder approved refund; funds not yet returned')}
else if(action==='refundDone'){if(s.role!=='founder'||c.status!=='refund approved')return fail('An approved refund and confirmation of returned funds are required.');c.status='refunded';msg('The operator confirmed your external refund is complete.');log('External refund completion recorded')}
else if(action==='cancel'){if(c.paid)return fail('Cancellation is unavailable after confirmed payment. Service failures go to founder review.');if(c.hold){if(c.quoteDay==='tomorrow')s.freeTomorrow++;else s.freeToday++;c.hold=false}c.status='cancelled';msg('Request cancelled before confirmed payment.');log('Unpaid request cancelled')}
else if(action==='remind'){if(!staff()||['cancelled','closed','delivered','refunded'].includes(c.status)||c.paid||c.reminded||!c.messages.some(m=>m.by==='staff'))return fail('One optional reminder after waiting 24 hours for a customer. Reply first; never remind a paid, declined or stopped case.');if(!c.waited24)return fail('Advance the demo by 24 hours before reminding.');c.reminded=true;c.messages.push({by:'staff',name:s.actor,text:'Would you still like help with this request? You can return whenever you are ready.'});log('One enquiry reminder sent')}
else if(action==='wait24'){c.waited24=true;log('Synthetic 24-hour wait elapsed')}
else if(action==='tick'){s.clock+=2;for(const x of s.cases)if(x.hold&&!x.paid&&x.holdEnd&&x.holdEnd<=s.clock){x.hold=false;if(x.quoteDay==='tomorrow')s.freeTomorrow++;else s.freeToday++;x.status=x.status==='payment review'?'late payment review':'payment expired';x.messages.push({by:'system',text:'Payment window expired. Late funds require staff review and an agreed booking or refund.'})}log('Demo clock advanced two hours')}
else if(action==='close'){if(!staff()||c.kind!=='support')return fail('Only the assigned Support operator may close this case.');c.status='closed';msg('Support case closed. Write again to reopen while history is retained.');log('Support case closed')}
else if(action==='customerMessage'){if(!value.trim())return fail('Write a message first.');if(c.kind==='support'&&c.status==='closed')c.status='open';c.messages.push({by:'customer',text:value});log('Customer message added')}
return s}
let state=initial();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>state.cases.find(c=>c.id===state.selected);const pill=s=>`<span class="badge ${s==='delivered'||s==='refunded'?'green':s.includes('review')||s.includes('recovery')?'amber':''}">${esc(s)}</span>`;
function act(a,v){state=transition(state,a,v??'');render();flash(state.feedback)}function flash(t){document.getElementById('toast').innerHTML=`<div class="feedback">${esc(t)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',4500)}function view(v){state.view=v;render()}function select(id){state.selected=id;render()}function setAudience(a){state.audience=a;render()}function resetAll(){state=initial();render()}function field(id){return document.getElementById(id)?.value??''}function options(arr,current){return arr.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('')}
function nav(){return `<nav aria-label="Admin sections">${[['overview','Overview'],['inbox','Service inbox'],['listings','Listings'],['users','Users'],['archive','Vehicle archive'],['moderation','Moderation'],['audit','Audit']].map(([id,label])=>`<button class="${state.view===id?'active':''}" ${state.view===id?'aria-current="page"':''} onclick="view('${id}')">${label}</button>`).join('')}<hr><small>Asia/Ashgabat · UTC+5<br>Daily 09:00–20:00<br><br>English prototype<br>RU / TK / EN planned</small></nav>`}
function header(title,sub){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="row"><label><small>Demo staff</small><select onchange="state.actor=this.value;render()">${options(['Ayna','Maksat'],state.actor)}</select></label><label><small>Permission</small><select onchange="state.role=this.value;render()">${options(['operator','founder'],state.role)}</select></label></div></div>`}
function caseRows(cases){return cases.length?`<div class="table"><table><thead><tr><th>Customer / request</th><th>Service</th><th>Status</th><th>Assigned to</th><th></th></tr></thead><tbody>${cases.map(c=>`<tr><td><strong>${esc(c.name)}</strong><br><small>${esc(c.title)}</small></td><td>${c.kind==='history'?'Vehicle History':'Support'}</td><td>${pill(c.status)}</td><td>${esc(c.assignee||'Unassigned')}</td><td><button onclick="state.selected='${c.id}';view('inbox')">Open request</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No requests match this view.</div>'}
function overview(){const n=state.cases.filter(c=>!c.assignee).length;return header('Today’s work','14 October 2026 · All figures are synthetic')+`<div class="stats"><button onclick="state.filter='unassigned';view('inbox')">Unassigned requests<strong>${n}</strong></button><button onclick="state.filter='payment';view('inbox')">Payment reviews<strong>${state.cases.filter(c=>c.status.includes('payment review')).length}</strong></button><button onclick="state.filter='paid';view('inbox')">Paid orders to fulfil<strong>${state.cases.filter(c=>c.paid&&!['delivered','refunded'].includes(c.status)).length}</strong></button><button onclick="state.filter='refund';view('inbox')">Refund decisions<strong>${state.cases.filter(c=>c.status==='refund approval').length}</strong></button></div><div class="split"><section class="panel"><h2>Requests needing attention</h2>${caseRows(state.cases)}</section><aside class="panel"><h2>Vehicle archive</h2><dl class="kv"><dt>Unique VINs</dt><dd>${new Set(state.archive.map(x=>x.vin)).size}</dd><dt>Dated reports</dt><dd>${state.archive.length}</dd><dt>Today’s open slots</dt><dd>${state.freeToday}</dd><dt>Tomorrow’s open slots</dt><dd>${state.freeTomorrow}</dd></dl><p class="muted">Capacity here is illustrative. The supplier’s daily counter and morning throughput are not verified.</p><button onclick="view('archive')">Search the archive</button></aside></div>`}
function attachments(c){return c.status==='delivered'?c.sources.map((r,i)=>`<div class="panel" style="margin-bottom:10px;padding:12px"><strong>${esc(r.provider)} report</strong><br><small>${esc(r.date)} · ${esc(r.vin)}</small><div class="row" style="margin-top:8px"><button onclick="reportPreview('${r.id}')">Open PDF preview</button><button onclick="reportPreview('${r.id}')">Shared link preview</button></div></div>`).join(''):''}
function messageList(c){return c.messages.map(m=>`<div class="msg ${m.by==='staff'?'staff':m.by==='system'?'system':''}"><small>${m.by==='staff'?'Carberk · '+esc(m.name||c.assignee):m.by==='system'?'Service update':esc(c.name)}</small>${esc(m.text)}</div>`).join('')+attachments(c)}
function inbox(){const c=current();let rows=state.cases.filter(x=>state.filter==='all'||state.filter==='unassigned'&&!x.assignee||state.filter==='payment'&&x.status.includes('payment review')||state.filter==='paid'&&x.paid||state.filter==='refund'&&x.status.includes('refund')||x.kind===state.filter);return header('Service inbox','Support and vehicle-history requests keep separate purposes and states.')+`<div class="tabs">${[['all','All'],['history','Vehicle History'],['support','Support'],['unassigned','Unassigned'],['payment','Payment review']].map(([v,l])=>`<button class="${state.filter===v?'active':''}" onclick="state.filter='${v}';render()">${l}</button>`).join('')}</div><div class="work"><aside class="queue"><h3>Requests</h3>${rows.length?rows.map(x=>`<button class="${x.id===c.id?'selected':''}" onclick="select('${x.id}')"><strong>${esc(x.name)}</strong>${esc(x.title)}<br><small>${esc(x.assignee||'Unassigned')} · ${esc(x.status)}</small></button>`).join(''):'<div class="empty">Queue empty</div>'}</aside><section class="thread"><div class="threadhead"><h2>${esc(c.title)}</h2><div class="row">${pill(c.status)}<span class="muted">${esc(c.name)} · ${esc(c.assignee||'Unassigned')}</span><button onclick="act('claim')">Claim</button><button onclick="act('handover')">Hand over</button></div></div><div class="messages">${messageList(c)}</div><div class="compose"><label for="reply">Reply to customer</label><textarea id="reply" placeholder="Write as Carberk…"></textarea><div class="row" style="margin-top:8px"><button class="primary" onclick="act('reply',field('reply'))">Send reply</button>${c.kind==='support'?'<button onclick="act(\'close\')">Close resolved case</button>':'<button onclick="act(\'remind\')">Send one reminder</button>'}</div></div></section><aside class="context"><section><h3>${c.kind==='history'?'Vehicle and order':'Customer context'}</h3><p>${c.vin?esc(c.vin):c.kind==='history'?'VIN not provided':'Seller · 2 synthetic listings'}</p>${c.listing?'<button onclick="view(\'listingDetail\')">View full listing</button>':''}<dl class="kv" style="margin-top:14px"><dt>Price</dt><dd>${c.kind==='history'?'100 TMT':'No charge'}</dd><dt>Payment</dt><dd>${c.paid?'Confirmed':'Not confirmed'}</dd><dt>Assigned</dt><dd>${esc(c.assignee||'None')}</dd>${c.kind==='history'?`<dt>Delivery</dt><dd>${esc(c.due)}</dd>`:''}</dl>${c.kind==='history'?`<div class="stack"><p class="muted">Availability is simulated. The seeded BMW VIN is a synthetic fixture, never a real lookup.</p><label>Demo eligibility result<select id="eligibility"><option value="available">Available history</option><option value="invalid">Invalid VIN format</option><option value="no-data">No report</option><option value="mismatch">Vehicle mismatch</option><option value="failure">Provider unavailable</option></select></label><button onclick="act('eligibility',field('eligibility'))">Check availability</button><button onclick="act('quote')">Offer 100 TMT quote</button><button onclick="act('confirm')">Confirm funds received</button><label>Operator report choice<select id="source"><option value="both">Fresh Carfax + AutoCheck</option><option value="Carfax">Carfax only</option><option value="AutoCheck">AutoCheck only</option><option value="archive">Archived Carfax · 10 Oct</option><option value="none">Neither available / failure</option></select></label><button onclick="act('obtain',field('source'))">Prepare reports</button><button class="primary" onclick="act('deliver')">Deliver checked documents</button><button onclick="act('failedUpload')">Simulate delivery failure</button><button onclick="act('refund')">Escalate refund</button>${state.role==='founder'?'<button onclick="act(\'approveRefund\')">Approve refund</button><button onclick="act(\'refundDone\')">Confirm refund returned</button>':''}</div>`:'<p class="muted">First response target: four staffed hours. Keep appeals available to restricted customers.</p>'}</section><section><h3>Private staff notes</h3><p class="muted">Never sent to the customer.</p>${c.notes.map(n=>`<p><strong>${esc(n.by)}</strong><br>${esc(n.text)}</p>`).join('')}<label for="note">Internal note</label><textarea id="note"></textarea><button onclick="act('note',field('note'))">Add private note</button></section></aside></div>${statePanel(c)}`}
function statePanel(c){return `<details class="state" open><summary>Prototype state and customer actions</summary><div class="stategrid">${[['Availability',c.eligible?'Confirmed':'Not confirmed'],['Customer accepted',c.accepted?'Yes':'No'],['Slot held',c.hold?'Yes':'No'],['Funds verified',c.paid?'Yes':'No'],['Operator',c.assignee||'None'],['Documents',c.sources?.map(x=>x.provider).join(', ')||'None'],['Today / tomorrow slots',state.freeToday+' / '+state.freeTomorrow],['Demo time',state.clock+':00 Asia/Ashgabat']].map(([k,v])=>`<div><small>${k}</small>${esc(v)}</div>`).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="act('accept')">Customer accepts quote</button><button onclick="act('receipt')">Customer submits payment claim</button><button onclick="act('cancel')">Customer asks to cancel</button><button onclick="act('tick')">Advance 2 hours</button><button onclick="act('wait24')">Simulate 24-hour wait</button></div></details>`}
function listing(){return header('BMW 530i · 2018','Synthetic listing L-1042 · Active')+`<div class="split"><section class="panel"><div class="listinghero">Vehicle media viewer<br>Synthetic photo / video placeholders</div><div class="thumbs"><span>Exterior</span><span>Interior</span><span>VIN</span><span>Video</span></div><h2>Vehicle specifications</h2><dl class="kv"><dt>Price</dt><dd>320,000 TMT</dd><dt>City</dt><dd>Ashgabat</dd><dt>Mileage</dt><dd>82,000 km · seller stated</dd><dt>Engine / gearbox</dt><dd>2.0 petrol / automatic</dd><dt>VIN</dt><dd>${DEMO_VIN}</dd><dt>Seller</dt><dd>Merdan A.</dd></dl><h2>Description</h2><p>Imported vehicle. Inspection welcome. This is fictional listing content for the prototype.</p><h2>Related vehicle history</h2><p>${state.archive.length} dated provider artifact(s) in internal archive. These are not public listing attachments.</p><button onclick="view('archive')">View dated reports</button></section><aside class="panel"><h2>Seller and activity</h2><p>Merdan A.<br><span class="muted">Account active · 2 listings</span></p><button onclick="view('users')">View customer context</button><hr><h2>Linked service request</h2><p>Vehicle History · ${esc(state.cases[0].status)}</p><button onclick="select('r1');view('inbox')">Open private request</button><hr><h2>Moderation</h2><p class="muted">Read the listing and evidence before taking action. Seller content is not editable here.</p><label for="reason">Required internal reason</label><textarea id="reason"></textarea><button class="danger" onclick="moderate()">Review listing ban</button></aside></div>`}
function listings(){return header('Listings','Search vehicles across marketplace states, not only reported listings.')+`<div class="panel"><div class="row"><label style="flex:1">Search listing, VIN or seller<input id="listingSearch" placeholder="Search…" oninput="filterListing(this.value)"></label><label>Status<select onchange="filterListing(this.value==='All states'?'':this.value)"><option>All states</option><option>Active</option></select></label></div><div class="table" style="margin-top:18px"><table><thead><tr><th>Vehicle</th><th>Seller</th><th>City / price</th><th>Status</th><th></th></tr></thead><tbody id="listingRows">${listingRow()}</tbody></table></div></div>`}function listingRow(){return `<tr><td><strong>BMW 530i · 2018</strong><br><small>${DEMO_VIN}</small></td><td>Merdan A.</td><td>Ashgabat<br>320,000 TMT</td><td>${pill('active')}</td><td><button onclick="view('listingDetail')">View listing</button></td></tr>`}function filterListing(q){document.getElementById('listingRows').innerHTML=('bmw 530i 2018 '+DEMO_VIN+' merdan a active ashgabat').toLowerCase().includes(q.toLowerCase())?listingRow():'<tr><td colspan="5">No listings match. Clear your search.</td></tr>'}
function archive(){return header('Vehicle archive','Original source and report dates are preserved. Internal access only.')+`<div class="panel"><label for="archiveSearch">Search VIN, provider or report date</label><input id="archiveSearch" placeholder="VIN / Carfax / date" oninput="archiveRows(this.value)"><div class="table" style="margin-top:18px"><table><thead><tr><th>VIN / vehicle</th><th>Provider</th><th>Report date</th><th>Reported mileage</th><th>Source</th><th></th></tr></thead><tbody id="archiveRows">${archiveMarkup(state.archive)}</tbody></table></div></div><div class="notice">This prototype does not resolve indefinite personal-data retention. Customer chat and payment evidence require a separate retention/deletion decision before launch.</div>`}function archiveMarkup(rows){return rows.length?rows.map(r=>`<tr><td class="vin">${esc(r.vin)}<br><small>BMW 530i · synthetic</small></td><td>${esc(r.provider)}</td><td>${esc(r.date)}</td><td>${esc(r.mileage)}</td><td>${esc(r.source)}</td><td><button onclick="reportPreview('${r.id}')">Open report</button></td></tr>`).join(''):'<tr><td colspan="6">No archived reports match.</td></tr>'}function archiveRows(q){document.getElementById('archiveRows').innerHTML=archiveMarkup(state.archive.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase())))}
function users(){return header('Users','Context for customer service, with scoped access to personal records.')+`<div class="panel"><label for="userSearch">Search display name</label><input id="userSearch" placeholder="Merdan / Selbi / Dovlet" oninput="userRows(this.value)"><div id="userRows">${userMarkup(state.cases)}</div></div>`}function userMarkup(rows){return rows.map(c=>`<div style="padding:18px 0;border-bottom:1px solid var(--line)"><h2>${esc(c.name)}</h2><p>Account active · ${esc(c.title)}</p><div class="row"><button onclick="state.selected='${c.id}';view('inbox')">Open assigned service context</button><button onclick="flash('Peer-to-peer message browsing is outside this scope.')">Marketplace message access</button>${state.role==='founder'?'<button onclick="flash(\'Historical evidence access would be audited. No real payment evidence in this demo.\')">Historical payment evidence</button>':''}</div></div>`).join('')||'<p class="empty">No customers match.</p>'}function userRows(q){document.getElementById('userRows').innerHTML=userMarkup(state.cases.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())))}
function moderation(){return header('Moderation','Content complaints are separate from purchased vehicle-history reports.')+`<div class="panel"><h2>Reported listing · BMW 530i</h2><p>Concern: misleading description. One synthetic complaint awaiting review.</p><button onclick="view('listingDetail')">Review full listing and seller</button><p class="muted" style="margin-top:15px">Existing moderation, required reasons and audit protections are retained. This demo does not connect to real enforcement.</p></div>`}
function audit(){return header('Audit','Actions in this synthetic session only.')+`<div class="panel">${state.audit.length?`<div class="timeline">${state.audit.map(x=>`<p><small>${esc(x.time)} · ${esc(x.actor)} · Asia/Ashgabat</small><br>${esc(x.text)}</p>`).join('')}</div>`:'<p class="empty">Take an action to see its audit entry.</p>'}</div>`}
function reportPreview(id){const r=state.archive.find(x=>x.id===id)||current().sources?.find(x=>x.id===id);if(!r)return;document.getElementById('preview').innerHTML=`<h1>Synthetic ${esc(r.provider)} report</h1><p class="notice">Workflow fixture. PDF rendering, download and public link sharing are simulated here. No provider report is generated.</p><dl class="kv"><dt>VIN</dt><dd>${esc(r.vin)}</dd><dt>Report date</dt><dd>${esc(r.date)}</dd><dt>Reported mileage</dt><dd>${esc(r.mileage)}</dd></dl><p>Source-attributed history belongs here. Missing events do not mean accident-free, and history is not an inspection.</p><button onclick="document.getElementById('preview').close()">Close preview</button>`;document.getElementById('preview').showModal()}
function moderate(){if(state.role!=='founder'){flash('This demo operator has no moderation permission. Switch to founder for this fixture.');return}if(!field('reason').trim()){flash('Enter a reason before reviewing the ban.');return}document.getElementById('preview').innerHTML=`<h2>Review listing ban</h2><p>This would hide the listing and prevent new marketplace contact. No actual listing will be changed.</p><p>${esc(field('reason'))}</p><button onclick="document.getElementById('preview').close();flash('Synthetic moderation action reviewed; no live action performed.')">Confirm demo action</button> <button onclick="document.getElementById('preview').close()">Cancel</button>`;document.getElementById('preview').showModal()}
function customer(){const c=current();const inner=state.customerPage==='home'?`<div class="inside"><h1>Find your next car</h1><p class="muted">Ashgabat · Synthetic marketplace</p><section class="service"><h2>Know the history before you buy</h2><p>Carfax or AutoCheck · <strong>100 TMT</strong><br>Both reports when available.</p><button class="primary" onclick="state.customerPage='info';render()">Vehicle History</button></section><label>Brand and model<select><option>Choose a vehicle</option><option>BMW</option><option>Toyota</option></select></label><div style="margin-top:22px"><h2>BMW 530i · 2018</h2><p>320,000 TMT · Ashgabat</p><button onclick="newRequest(true)">Check this listing’s history</button></div></div>`:state.customerPage==='info'?`<div class="inside"><h1>Vehicle History</h1><p>Check available history abroad before buying an imported vehicle.</p><h2>100 TMT per vehicle</h2><p>We provide Carfax or AutoCheck. If both are available, we include both. Reports may contain different records and do not cover every event.</p><p class="muted">History does not replace inspection. Turkmenistan record coverage is not offered.</p><button onclick="sample()">View sample report</button><hr><p>Operators available daily 09:00–20:00 Turkmenistan time.</p><button class="primary" onclick="newRequest(false)">Sign in and start a request</button><button onclick="state.customerPage='history';render()">Previous requests</button><button onclick="state.customerPage='support';render()">General Support</button></div>`:state.customerPage==='history'?`<div class="inside"><h1>Your report requests</h1><button class="primary" onclick="newRequest(false)">New request</button>${state.cases.filter(x=>x.kind==='history').map(x=>`<div style="padding:18px 0;border-bottom:1px solid var(--line)"><strong>${esc(x.title)}</strong><p>${pill(x.status)}</p><button onclick="state.selected='${x.id}';state.customerPage='chat';render()">${x.status==='delivered'?'Open previous reports':'Continue request'}</button></div>`).join('')}</div>`:state.customerPage==='support'?`<div class="inside"><h1>Carberk Support</h1><p>For account, listing and app questions. Vehicle History has a separate request queue.</p><button class="primary" onclick="state.selected='s1';state.customerPage='chat';render()">Open Support chat</button></div>`:`<div class="inside"><button onclick="state.customerPage=c.kind==='history'?'history':'info';render()">Back to ${c.kind==='history'?'requests':'services'}</button><h1 style="margin-top:20px">Carberk ${c.kind==='history'?'report service':'Support'}</h1><p class="muted">${esc(c.assignee||'Awaiting operator')} · ${esc(c.status)}</p>${c.vin?`<p>${esc(c.vin)}</p>`:''}</div><div class="messages">${messageList(c)}</div><div class="inside">${c.status==='quote'?'<button class="primary" onclick="act(\'accept\')">Confirm VIN, price and rules</button>':''}${c.status==='awaiting payment'?'<div class="notice">External payment instructions will come from your operator. This prototype has no payment destination.</div><button onclick="act(\'receipt\')">I paid · submit evidence</button>':''}${c.kind==='history'&&!c.accepted&&!c.paid?`<label for="requestVin">VIN, optional while asking questions</label><input id="requestVin" maxlength="17" value="${esc(c.vin)}" placeholder="17 characters"><button onclick="act('vin',field('requestVin'))">Submit VIN for review</button><p class="muted">We check format, vehicle details and report availability before payment. A correctly formatted VIN does not prove the vehicle is genuine.</p>`:''}<label for="customerReply">Your message</label><textarea id="customerReply" placeholder="Ask a question, even without a VIN"></textarea><button onclick="act('customerMessage',field('customerReply'))">Send message</button><button onclick="setAudience('admin');view('inbox')">Continue as demo operator</button></div>`;return `<main class="content"><div class="heading"><div><h1>Customer journey</h1><p class="muted">Mobile-sized workflow preview. Sign-in is simulated.</p></div><div class="row">${[['home','Feed'],['info','Service info'],['history','Messages'],['support','Support']].map(([v,l])=>`<button onclick="state.customerPage='${v}';render()">${l}</button>`).join('')}</div></div><div class="phone"><div class="bar"><span class="brand">Carberk<span>.</span></span><small>Customer preview</small></div>${inner}</div></main>`}
function newRequest(fromListing){const old=state.cases.find(c=>c.kind==='history'&&c.vin===DEMO_VIN&&c.status==='delivered');if(old&&fromListing){document.getElementById('preview').innerHTML=`<h2>You already have reports for this VIN</h2><p>Open your previous purchase or start a new request. A new request does not promise a fresh provider check.</p><button onclick="state.selected='${old.id}';state.customerPage='chat';document.getElementById('preview').close();render()">Open previous reports</button> <button onclick="createRequest(${fromListing});document.getElementById('preview').close()">New request</button>`;document.getElementById('preview').showModal();return}createRequest(fromListing)}function createRequest(fromListing){const id='r'+(state.cases.length+1);state.cases.push({id,kind:'history',name:'Demo customer',title:fromListing?'BMW 530i · 2018':'Vehicle history enquiry',vin:fromListing?DEMO_VIN:'',listing:fromListing?'l1':null,status:'enquiry',assignee:null,eligible:false,accepted:false,paid:false,hold:false,due:'Not agreed',sources:[],notes:[],messages:[{by:'system',text:'Ask a question or request a vehicle report. No payment is needed to enquire.'}]});state.selected=id;state.customerPage='chat';render()}
function sample(){state.selected='r1';document.getElementById('preview').innerHTML='<h1>Sample vehicle history</h1><p class="notice">Synthetic educational example. A real authorized sample PDF is still needed for launch.</p><p>Provider reports can contain ownership changes, recorded mileage, damage, maintenance and title events. Coverage varies. Carfax and AutoCheck may differ.</p><button onclick="downloadSample()">Download sample explanation</button> <button onclick="document.getElementById(\'preview\').close()">Close</button>';document.getElementById('preview').showModal()}
function downloadSample(){const text='CARBERK SYNTHETIC SAMPLE\nNot an actual Carfax or AutoCheck report.\nExample: recorded mileage, past ownership and damage events.\nMissing events do not prove no damage. Reports do not replace inspection.\n100 TMT provides Carfax or AutoCheck; both when available.';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='carberk-synthetic-sample.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const scenarios={sale:{label:'Paid delivery',text:'An enquiry becomes one paid order. A screenshot alone never marks it paid.',steps:[['Claim request','claim'],['Confirm available history','eligibility','available'],['Offer quote','quote'],['Customer accepts','accept'],['Customer submits receipt','receipt'],['Operator confirms funds','confirm'],['Prepare both reports','obtain','both'],['Deliver and archive','deliver']]},single:{label:'One provider',text:'Either provider is enough for 100 TMT when only one report is available.',steps:[['Claim','claim'],['Check availability','eligibility','available'],['Quote','quote'],['Accept','accept'],['Receipt','receipt'],['Confirm funds','confirm'],['AutoCheck only','obtain','AutoCheck'],['Deliver','deliver']]},expired:{label:'Expired payment',text:'A payment claim is reviewed but its booking hold expires. Staff cannot blindly confirm it.',steps:[['Claim','claim'],['Check','eligibility','available'],['Quote','quote'],['Accept','accept'],['Receipt','receipt'],['Advance two hours','tick'],['Try confirming expired booking','confirm']]},failure:{label:'Failed fulfilment',text:'No report can be provided. Founder approval and actual refund completion are different steps.',steps:[['Claim','claim'],['Check','eligibility','available'],['Quote','quote'],['Accept','accept'],['Receipt','receipt'],['Confirm funds','confirm'],['Provider fails','obtain','none'],['Escalate refund','refund'],['Switch to founder','founder'],['Approve refund','approveRefund'],['Record funds returned','refundDone']]},archive:{label:'Reuse an archive',text:'Operator selects an older report; original date is retained after delivery.',steps:[['Claim','claim'],['Check','eligibility','available'],['Quote','quote'],['Accept','accept'],['Receipt','receipt'],['Confirm funds','confirm'],['Choose archived report','obtain','archive'],['Deliver','deliver']]},support:{label:'Support case',text:'General Support stays separate from report payments and fulfilment.',steps:[['Claim Support case','claim'],['Reply','reply','We will check why your listing is not visible.'],['Add private note','note','Check publication state before responding.'],['Close resolved case','close'],['Customer reopens','customerMessage','I need help again.']]},full:{label:'Capacity full',text:'When today and tomorrow are both full, enquiries stay open but no payment quote is issued.',steps:[['Claim','claim'],['Check availability','eligibility','available'],['Try offering payment quote','quote']]},invalid:{label:'Invalid VIN',text:'Formatting, missing history and mismatched vehicle are different outcomes. Do not take payment.',steps:[['Claim','claim'],['Invalid VIN result','eligibility','invalid'],['Try offering quote','quote']]}};
function guided(){const sc=scenarios[state.scenario];return `<section class="guided"><h2>Guided walkthroughs</h2><div class="tabs">${Object.entries(scenarios).map(([id,x])=>`<button class="${state.scenario===id?'active':''}" onclick="startScenario('${id}')">${x.label}</button>`).join('')}</div><p>${sc.text}</p><div class="row"><button class="primary" onclick="nextStep()">${state.step<sc.steps.length?`${state.step+1}. ${sc.steps[state.step][0]}`:'Walkthrough complete'}</button><button onclick="startScenario('${state.scenario}')">Restart scenario</button></div><small>Controls remain available for free play. Guardrails are prototype behaviour, not production verification.</small></section>`}
function startScenario(id){const audience=state.audience;state=initial();state.audience=audience;state.scenario=id;state.view='inbox';if(id==='support')state.selected='s1';if(id==='full'){state.freeToday=0;state.freeTomorrow=0}render()}function nextStep(){const steps=scenarios[state.scenario].steps;if(state.step>=steps.length)return;const [,a,v]=steps[state.step];if(a==='founder'){state.role='founder';state.feedback='Demo permission switched to founder'}else state=transition(state,a,v??'');state.step++;render();flash(state.feedback)}
function render(){document.getElementById('adminToggle').className=state.audience==='admin'?'primary':'';document.getElementById('customerToggle').className=state.audience==='customer'?'primary':'';if(state.audience==='customer'){document.getElementById('app').innerHTML=customer()+`<div style="max-width:1000px;margin:0 auto 20px;padding:0 20px">${guided()}</div>`;return}const pages={overview,inbox,listings,listingDetail:listing,users,archive,moderation,audit};document.getElementById('app').innerHTML=`<div class="shell">${nav()}<main class="content">${(pages[state.view]||overview)()}${guided()}<footer>Local synthetic prototype · no live service connections · payment, provider, retention and language implementation remain open.</footer></main></div>`}
render();
</script></body></html>
