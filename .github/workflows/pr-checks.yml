name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

# A new push to a pull request cancels that pull request's older run, so CI
# never keeps testing a commit that has already been replaced.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Job graph (see README.md): lane → docs | static + backend + frontend → pr.
# The work jobs run in parallel on separate runners; `pr` is the one required
# check and passes only when every job it needs passed or the lane skipped it.
jobs:
  # Docs for an all-docs PR, or docs hand changes after its green previous
  # head. Missing or ambiguous evidence takes full.
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      # Depth 2 fetches the synthetic merge and both parents. The lane script
      # deepens exact event SHAs only when it needs the PR head history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Choose the CI lane
        id: lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-lane.mjs HEAD^1

  docs:
    needs: lane
    if: needs.lane.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node so `cache: pnpm` can find it.
      # It reads its version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      # Standard GitHub cache of the pnpm store, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:glossary

      - run: pnpm test:ci-lane

      - name: Docs checks
        run: pnpm test:agent-docs && pnpm test:glossary

  # Lint, typecheck and the admin build with its runtime smoke. No services.
  static:
    needs: lane
    if: needs.lane.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Prisma loads prisma.config.ts during generate and requires a
      # DATABASE_URL, though generate never connects. Unreachable port 1.
      DATABASE_URL: postgresql://auto_tm_ci:auto_tm_ci_pass@127.0.0.1:1/auto_tm_ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:glossary

      - run: pnpm test:ci-lane

      - run: pnpm --filter @auto-tm/db generate

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Build admin and verify real session/runtime paths
        run: pnpm --filter @auto-tm/admin verify:runtime

  # api, worker and db tests against disposable Postgres, Redis and MinIO.
  backend:
    needs: lane
    if: needs.lane.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Safe unreachable defaults, replaced by the service step with this
      # run's mapped ports.
      DATABASE_URL: postgresql://auto_tm_ci:auto_tm_ci_pass@127.0.0.1:1/auto_tm_ci
      REDIS_URL: redis://127.0.0.1:1
      MINIO_ENDPOINT: http://127.0.0.1:1
      MINIO_PUBLIC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Start disposable test services
        shell: bash
        run: bash scripts/ci-services.sh up

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @auto-tm/db generate

      - name: Deploy migrations to the disposable database
        run: pnpm db:migrate:deploy

      - name: Create disposable media buckets
        run: pnpm minio:bootstrap

      - run: pnpm test:backend
        env:
          NODE_ENV: test
          APP_ENV: test
          # The runner is discarded after the job, so Ryuk adds no cleanup.
          # Spec files run in fresh workers and reconnect to the previous
          # file's Ryuk, which can stop between files: "Failed to connect
          # to Reaper".
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Show test service logs on failure
        if: failure()
        shell: bash
        run: bash scripts/ci-services.sh logs

      # always() also runs this step when a newer push cancels the run.
      - name: Remove disposable test services
        if: always()
        shell: bash
        run: bash scripts/ci-services.sh down

  # mobile, web, admin, contracts and sms-gateway tests, then the root
  # scripts' node --test files. No services.
  frontend:
    needs: lane
    if: needs.lane.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:frontend

      # After the workspace tests: the reviewer-flow smoke imports the built
      # @auto-tm/contracts.
      - run: pnpm test:root

  # The required status check in branch protection. Keep the job id `pr`.
  # `if: always()` is load-bearing: without it, a failed job makes GitHub skip
  # this one, and a skipped required check counts as passing.
  pr:
    needs: [lane, docs, static, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to pass or be skipped by the lane
        env:
          LANE: ${{ needs.lane.outputs.lane }}
          LANE_RESULT: ${{ needs.lane.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          failed=0
          # require <job> <result> <lane that skips it>
          require() {
            if [[ "$2" == success ]]; then
              echo "$1: success"
            elif [[ "$2" == skipped && "$LANE_RESULT" == success && "$LANE" == "$3" ]]; then
              echo "$1: skipped by the $LANE lane"
            else
              echo "::error::$1: $2"
              failed=1
            fi
          }
          require lane "$LANE_RESULT" none
          require docs "$DOCS_RESULT" full
          require static "$STATIC_RESULT" docs
          require backend "$BACKEND_RESULT" docs
          require frontend "$FRONTEND_RESULT" docs
          exit "$failed"
