name: Bundle

on:
  push:
    tags: ["v*"]
  # Dry run without a tag. It builds the images and uploads the tarball as a
  # workflow artifact only; it publishes nothing else.
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for the dry-run bundle, for example dev-abc1234
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    # x86 Linux, the architecture of the TM-era servers the bundle is loaded on.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A tag push uses the pushed tag. A manual run uses the input, or a
      # dev tag from the commit. A branch name is never used: it can contain
      # "/", which is not valid in an image tag or the artifact file name.
      BUNDLE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || format('dev-{0}', github.sha) }}

    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so `cache: pnpm` can find it.
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      # Standard GitHub cache of the pnpm store, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma 7 loads prisma.config.ts during generate and requires a
      # DATABASE_URL to be set, though generate never connects. The Mac runner
      # inherited one from its environment; a hosted runner has none, so use
      # the same placeholder the service Dockerfiles use.
      - run: pnpm --filter @auto-tm/db generate
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      # Builds the images with the runner's Docker and saves them with
      # `docker save` into images/auto-tm-<tag>.tar.gz.
      - run: make bundle TAG="$BUNDLE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: auto-tm-${{ env.BUNDLE_TAG }}
          path: images/auto-tm-${{ env.BUNDLE_TAG }}.tar.gz
          retention-days: 90
          if-no-files-found: error
