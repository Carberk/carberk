# Preparation only. No public ingress; start only in an explicitly admitted synthetic environment.
name: carberk-synthetic-diagnostics
x-collector: &collector
  image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
  profiles: [synthetic-diagnostics]
  restart: "no"
  read_only: true
  tmpfs: ["/tmp:size=33554432,mode=1777"]
  pids_limit: 128
  cpus: 0.5
  mem_limit: 384m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
  networks: [diagnostics]
  volumes: [collector-files:/code/uploads]
  environment: &environment
    DATABASE_URL: postgresql://diagnostics:${DIAGNOSTICS_DB_PASSWORD:?Separate collector DB password required}@db:5432/diagnostics
    SECRET_KEY: ${DIAGNOSTICS_SECRET_KEY:?Separate random collector secret required}
    GLITCHTIP_DOMAIN: ${DIAGNOSTICS_HTTPS_ORIGIN:?Admitted collector HTTPS origin required}
    ALLOWED_HOSTS: ${DIAGNOSTICS_ALLOWED_HOST:?Admitted collector hostname required}
    CSRF_TRUSTED_ORIGINS: ${DIAGNOSTICS_HTTPS_ORIGIN:?Admitted collector HTTPS origin required}
    DEBUG: "false"
    ENABLE_TEST_API: "false"
    ENABLE_OBSERVABILITY_API: "false"
    ENABLE_USER_REGISTRATION: "false"
    ENABLE_SOCIAL_APPS_USER_REGISTRATION: "false"
    ENABLE_ORGANIZATION_CREATION: "false"
    EMAIL_ENABLED: "false"
    SENTRY_DSN: ""
    VALKEY_URL: ""
    LOG_LEVEL: WARNING
    GLITCHTIP_ENABLE_LOGS: "false"
    GLITCHTIP_ENABLE_UPTIME: "false"
    GLITCHTIP_ENABLE_MCP: "false"
    GLITCHTIP_ENABLE_DUCKDB: "false"
    GLITCHTIP_RETENTION_DAYS: "30"
    GLITCHTIP_EVENT_RETENTION_DAYS: "30"
    GLITCHTIP_FILE_RETENTION_DAYS: "30"
    GLITCHTIP_RELEASE_RETENTION_DAYS: "30"
    GLITCHTIP_MAX_UNZIPPED_PAYLOAD_SIZE: "16384"
    GLITCHTIP_MAX_UNZIPPED_ARCHIVE_SIZE: "1048576"
    GLITCHTIP_PII_SCRUB_DEFAULT: '{"enabled":true,"scrub_defaults":true,"scrub_credit_cards":true,"scrub_private_keys":true,"scrub_emails":true}'
    DATABASE_POOL_MAX_SIZE: "2"
    GRANIAN_WORKERS: "1"
    VTASKS_CONCURRENCY: "2"
    VTASKS_INGEST_CONCURRENCY: "1"
    VTASKS_INGEST_BATCH_COUNT: "5"
services:
  web:
    <<: *collector
    environment:
      <<: *environment
      SERVER_ROLE: web
    depends_on: {db: {condition: service_healthy}}
  worker:
    <<: *collector
    environment:
      <<: *environment
      SERVER_ROLE: worker
    depends_on: {db: {condition: service_healthy}}
  migrate:
    <<: *collector
    command: [./manage.py, migrate, --noinput]
    depends_on: {db: {condition: service_healthy}}
  db:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    profiles: [synthetic-diagnostics]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=16777216,mode=1777", "/var/run/postgresql:size=1048576,mode=1777"]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    shm_size: 64m
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 1m, max-file: "2"}}
    networks: [diagnostics]
    environment:
      POSTGRES_DB: diagnostics
      POSTGRES_USER: diagnostics
      POSTGRES_PASSWORD: ${DIAGNOSTICS_DB_PASSWORD:?Separate collector DB password required}
    volumes: [collector-db:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U diagnostics -d diagnostics]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  collector-db:
  collector-files:
networks:
  diagnostics:
    internal: true
