  (map #320 "Google Play reviewer-only Android release readiness").
  Question: what do Cabinet, Profile, Settings, Delete account and the phone-or-email sign-in screens look like in every state?
  Respects: #344 (five tabs; Cabinet → Profile, My listings, Settings; Settings holds language, theme, legal, Log out,
  Delete account), #348 / ADR-0054 (Sign-in Methods optional, unique, always verified; add/change by code; can change
  but not remove; a taken value is refused after the code is confirmed, never merged; DELETE /me unchanged; neutral
  web deletion copy), ADR-0056 (supersedes ADR-0054's "Add a phone" sell step and PHONE_REQUIRED: every Listing's
  contact phone is verified in the Sell wizard, email-only Users sell without an account phone), ADR-0055 (email
  codes, 10-minute expiry), ADR-0032 (30-day grace deletion, recoverable by signing in), #322/#496 (legal and
  deletion pages on autotm.bagtyyar.dev), #352 D10 + #500 (Contact support screen: phone and email, chat after
  release), #326 (no dead actions).
  RECONCILED 2026-10-02: founder approved D2 = A (Phone | Email tabs). Options that conflicted with approved
  decisions were removed; see the "Conflicts resolved" panel.
  No share affordances (#495). No real phone numbers, emails, codes or secrets: every value here is made up.
  Colours are AutoTM tokens from apps/mobile/global.css (light and dark). Not Auto.ru's look; Auto.ru/Kolesa are structure references only.
  RU/TK strings marked "draft" in the state list are new and need a native-speaker review.

const t=(k,v)=>{const a=TX[k];let s=a?a[LANGS.indexOf(S.lang)]:k;if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s;};

/* ───────────── state ───────────── */
const S={
  acct:"out", phone:"+993 61 00-00-00", email:"name@example.com",   // all fake
  lang:"en", theme:"light", os:false,
  stack:[{id:"cabinet"}], tab:"cabinet",
  v:{cab:"B",entry:"B",sell:"A",set:"A",chg:"B",taken:"A",del:"A"},
  dec:"cab", data:"ok", outcome:"ok", req:"ok", delOut:"ok",
  flow:null, ret:null, toast:null, sheet:null, dlg:null, web:null, delChecked:false,
  notif:{msg:true,act:true,os:"granted"}, picker:null, name:null,
};
const hasPhone=()=>S.acct==="phone"||S.acct==="both", hasEmail=()=>S.acct==="email"||S.acct==="both", signed=()=>S.acct!=="out";
const setAcct=()=>{S.acct=hasPhone()&&hasEmail()?"both":hasPhone()?"phone":hasEmail()?"email":"out";};
const maskPhone=p=>p.replace(/^(\+993 \d)\d( )\d\d-\d\d-(\d\d)$/,"$1• ••-••-$3").replace(/^(\+993 6)(\d)/,"$1•");
const maskPhoneDisp=p=>{const d=p.replace(/\D/g,"");return "+993 "+d[3]+"• ••-••-"+d.slice(-2);};
const maskEmail=e=>{const [a,b]=e.split("@");return a[0]+"•••@"+b;};
const dest=(type,val)=>type==="phone"?maskPhoneDisp(val):maskEmail(val);
const topScreen=()=>S.stack[S.stack.length-1];
const TABS=["search","favorites","sell","messages","cabinet"];
const isTab=id=>TABS.includes(id);
const fmtPhone=d=>(d=d.replace(/\D/g,"").slice(0,8),d.length>6?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4,6)+"-"+d.slice(6):d.length>4?d.slice(0,2)+" "+d.slice(2,4)+"-"+d.slice(4):d.length>2?d.slice(0,2)+" "+d.slice(2):d);
const validPhone=v=>{const d=v.replace(/\D/g,"");return d.length===8&&d[0]==="6";};
const validEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

/* ───────────── navigation ───────────── */
function push(id,p={}){S.stack.push({id,...p});render();}
function pop(){if(S.stack.length>1)S.stack.pop();render();}
function reset(tab){S.tab=tab;S.stack=[{id:tab}];S.sheet=S.dlg=null;render();}
function toast(m){S.toast=m;render();clearTimeout(window._t);window._t=setTimeout(()=>{S.toast=null;render();},2400);}
function startSignIn(){S.ret=S.stack.slice();S.flow={kind:"signin",type:"phone",val:"",err:null,step:S.v.entry==="B"?"choose":"entry"};push("signin");}
function closeSignIn(){S.stack=S.ret||[{id:"cabinet"}];S.flow=null;render();}
function startMethod(kind,type){S.flow={kind,type,val:"",err:null,step:"entry",back:S.stack.slice()};push("methodEntry");}
function openLegal(kind){S.web={kind};render();}

/* ───────────── flows ───────────── */
function detect(v){return /^[+\d\s()-]+$/.test(v)&&v.replace(/\D/g,"").length>0?"phone":"email";}
function liveVal(el){
  const f=S.flow;let v=el.value;
  if(f.type==="phone"&&!(S.v.entry==="C"&&f.kind==="signin")){v=fmtPhone(v.replace(/^\+?993/,""));el.value=v;}
  f.val=v;f.err=null;
}
function demoFill(){const f=S.flow;f.val=f.type==="phone"?"60 00-00-00":"name@example.com";f.err=null;render();}
function getCode(){
  const f=S.flow;let type=f.type;
  if(S.v.entry==="C"&&f.kind==="signin"&&f.step==="entry"){type=detect(f.val);}
  let val=f.val.trim();
  const phoneish=type==="phone";
  if(S.v.entry==="C"&&f.kind==="signin"&&phoneish)val=fmtPhone(val.replace(/^\+?993/,""));
  const ok=phoneish?validPhone(val):validEmail(val);
  if(!ok){f.err="invalid";f.type=type;render();return;}
  const r=S.req;S.req="ok";
  if(r==="offline"){f.err="offline";render();return;}
  if(r==="rate"){f.err="rate";render();return;}
  if(r==="rateDay"){f.err="rateDay";render();return;}
  f.type=type;f.val=val;f.err=null;f.code="";f.cerr=null;f.sec=15;f.resends=0;f.nomail=false;
  if(f.kind==="webdelete"){f.step="code";render();}else push("code");
}
function key(d){
  const f=S.flow;if(!f||f.cerr==="locked"||f.busy)return;
  f.code=f.code||"";
  if(d==="<"){f.code=f.code.slice(0,-1);f.cerr=null;render();return;}
  if(f.code.length>=6)return;
  f.code+=d;f.cerr=null;render();
  if(f.code.length===6){f.busy=true;setTimeout(submitCode,350);}
}
function submitCode(){
  const f=S.flow;if(!f)return;f.busy=false;
  let o=S.outcome;S.outcome="ok";
  if(o==="taken"&&!(f.kind==="add"||f.kind==="change"))o="ok";
  if(o==="grace"&&f.kind!=="signin")o="ok";
  if(o==="wrong"||o==="expired"||o==="locked"||o==="offline"){f.cerr=o;f.code="";render();return;}
  if(o==="taken"){S.stack.pop();push("taken");return;}
  success(o==="grace");
}
function success(grace){
  const f=S.flow;
  if(f.kind==="signin"){
    S.acct=f.type==="phone"?"phone":"email";
    if(f.type==="phone")S.phone=f.val.startsWith("+")?f.val:"+993 "+f.val;else S.email=f.val;
    S.stack=S.ret;S.flow=null;
    if(grace){S.dlg="restore";render();}else toast(t("signedIn"));
  }else if(f.kind==="add"||f.kind==="change"){
    if(f.type==="phone")S.phone="+993 "+f.val;else S.email=f.val;
    setAcct();S.stack=f.back;S.flow=null;toast((f.kind==="add"?t("added"):t("changed"))+": "+dest(f.type,f.type==="phone"?S.phone:S.email));
  }else if(f.kind==="delete"){
    S.acct="out";S.stack=[{id:"cabinet"}];S.tab="cabinet";S.flow=null;push("scheduled");
  }else if(f.kind==="webdelete"){f.step="done";render();}
}
function resend(){
  const f=S.flow;if(f.sec>0)return;
  const r=S.req;S.req="ok";
  if(r==="rateDay"||f.resends>=4){f.cerr="rateDay";render();return;}
  if(r==="rate"){f.cerr="rate";render();return;}
  if(r==="offline"){f.cerr="offline";render();return;}
  f.resends++;f.sec=15;f.code="";f.cerr=null;toast(t("otpSent",{d:dest(f.type,f.val)}));
}
function backFromCode(){const f=S.flow;f.code="";f.cerr=null;if(f.kind==="webdelete"){f.step="entry";render();}else if(f.kind==="delete"){S.flow=null;pop();}else pop();}
setInterval(()=>{const f=S.flow;if(f&&f.sec>0&&(topScreen().id==="code"||(topScreen().id==="webDelete"&&f.step==="code"))){f.sec--;renderPhone();}},1000);

function doDelete(){
  S.dlg=null;const o=S.delOut;S.delOut="ok";
  if(o==="fail"){S.delFailed=true;render();return;}
  S.delFailed=false;
  if(S.v.del==="B"){
    const type=hasPhone()?"phone":"email";
    S.flow={kind:"delete",type,val:S[type],err:null,code:"",cerr:null,sec:15,resends:0,step:"code"};push("code");
  }else{S.acct="out";S.stack=[{id:"cabinet"}];S.tab="cabinet";push("scheduled");}
}
function doLogout(){S.dlg=null;S.acct="out";reset("cabinet");toast({en:"Signed out",ru:"Вы вышли",tk:"Çykyldy"}[S.lang]);}
function restore(){S.dlg=null;toast({en:"Account restored. Your Listings are back.",ru:"Аккаунт восстановлен. Объявления снова активны.",tk:"Hasap dikeldildi. Bildirişler gaýdyp geldi."}[S.lang]);}
function restoreCancel(){S.dlg=null;S.acct="out";render();}

/* ───────────── building blocks ───────────── */
const ic={back:"←",x:"✕",gear:"⚙",chev:"›"};
function appbar(title,o={}){return `<div class="appbar">${o.noBack?"":`<button class="ib" aria-label="Back" onclick="${o.back||"pop()"}">${ic.back}</button>`}<div class="t" ${o.noBack?"":'style="font-size:18px;font-family:inherit"'}>${title||""}</div>${o.right||""}</div>`;}
function btn(label,fn,cls="brand",dis=false){return `<button class="btn ${cls}" ${dis?"disabled":""} onclick="${fn}">${label}</button>`;}
function skeletonLines(){return `<div class="pad" style="padding-top:14px"><div class="skel" style="height:64px;width:64px;border-radius:50%"></div><div class="skel" style="height:18px;width:50%;margin-top:12px"></div><div class="skel" style="height:90px;margin-top:14px;border-radius:12px"></div><div class="skel" style="height:90px;margin-top:12px;border-radius:12px"></div></div>`;}
function errState(){return `<div class="pad" style="text-align:center;padding-top:80px"><div style="font-size:34px">⚠</div><div class="b" style="font-size:17px;margin:8px 0">${t("wrong")}</div><div class="mute sm" style="margin-bottom:16px">${t("offline")}</div><div style="max-width:180px;margin:auto">${btn(t("retry"),"S.data='ok';render()","out")}</div></div>`;}
function avatar(sz,name){return `<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz/2.4}px">${name?name[0].toUpperCase():"👤"}</div>`;}
function idLabel(){return hasPhone()?maskPhoneDisp(S.phone):maskEmail(S.email);}
function methodRow(type){
  const has=type==="phone"?hasPhone():hasEmail();
  const val=has?(type==="phone"?maskPhoneDisp(S.phone):maskEmail(S.email)):null;
  const act=has?t("change"):t("add");
  const fn=has&&S.v.chg==="B"?`S.sheet={t:'chg',type:'${type}'};render()`:`startMethod('${has?"change":"add"}','${type}')`;
  return `<div class="row" role="button" aria-label="${t(type)}, ${val||t("notAdded")}. ${act}" onclick="${fn}"><div class="l"><div class="mute sm">${t(type)}</div>${val?`<div class="b" style="font-size:16px">${val}</div><div class="badge ver" style="margin-top:2px">✓ ${type==="phone"?t("phoneVer"):t("verified")}</div>`:`<div class="mute" style="font-size:16px">${t("notAdded")}</div>`}</div><span class="b sm">${act}</span><span class="chev">${ic.chev}</span></div>`;
}
function legalLinks(){return `<div class="xs mute" style="padding:0 16px 14px">${t("legalPre")} <a style="color:var(--info);text-decoration:underline" onclick="openLegal('terms')">${t("terms")}</a> ${t("and")} <a style="color:var(--info);text-decoration:underline" onclick="openLegal('privacy')">${t("privacy")}</a>.</div>`;}
function langSwitch(){return `<div style="display:flex;gap:4px">${LANGS.map(l=>`<button class="badge" style="cursor:pointer;${S.lang===l?"background:var(--fg);color:var(--bg)":""}" onclick="S.lang='${l}';render()">${l.toUpperCase()}</button>`).join("")}</div>`;}

/* ───────────── screens ───────────── */
function listingsBlock(){return {a:2,d:1,s:0,r:1};}
function cabinetScreen(){
  const v=S.v.cab;const gear=`<button class="ib" aria-label="${t("settings")}" onclick="push('settings')">${ic.gear}</button>`;
  let h=`<div class="appbar"><div class="t">${t("cabinet")}</div>${v==="C"?"":gear}</div>`;
  if(S.data==="loading"&&signed())return h+skeletonLines();
  if(S.data==="error"&&signed())return h+errState();
  const out=!signed();
  const signCard=`<div class="card"><div style="text-align:center;padding:26px 16px">${avatar(72)}<div class="b" style="font-size:18px;margin:12px 0 4px">${t("signInManageT")}</div><div class="mute sm" style="margin-bottom:14px">${t("signInManageD")}</div><div style="max-width:200px;margin:auto">${btn(t("signIn"),"startSignIn()")}</div></div></div>`;
  const nudge=signed()&&!hasPhone()?`<div class="note warn" onclick="startMethod('add','phone')" style="cursor:pointer"><div class="b">☎ ${t("cabAddPhoneT")}</div><div class="sm mute">${t("cabAddPhoneD")}</div><div class="b sm" style="margin-top:4px;color:var(--info)">${t("add")} ${ic.chev}</div></div>`:"";
  const L=listingsBlock();
  if(v==="A"){
    h+=out?signCard:`<div class="card row" onclick="push('profile')">${avatar(56,S.name)}<div class="l"><div class="b" style="font-size:17px">${S.name||idLabel()}</div>${S.name?`<div class="mute sm">${idLabel()}</div>`:""}</div><span class="chev">${ic.chev}</span></div>${nudge}`;
    h+=`<div class="card row" onclick="push('listingsStub')"><div style="font-size:22px">☰</div><div class="l"><div class="b">${t("myListings")}</div></div><span class="chev">${ic.chev}</span></div><div class="pad" style="margin-top:6px">${btn("＋ "+t("listCar"),"reset('sell')")}</div>`;
  }else if(v==="B"){
    if(out)h+=signCard;
    else{
      h+=`<div class="card"><div class="row" onclick="push('profile')" style="min-height:64px">${avatar(48,S.name)}<div class="l"><div class="b" style="font-size:17px">${S.name||t("profile")}</div><div class="mute sm">${t("profile")} · ${t("methods")}</div></div><span class="chev">${ic.chev}</span></div>
      <div class="row" onclick="${hasPhone()?"push('profile')":"startMethod('add','phone')"}"><span>☎</span><div class="l">${hasPhone()?`<div class="b">${maskPhoneDisp(S.phone)}</div><div class="badge ver">✓ ${t("phoneVer")}</div>`:`<div class="mute">${t("phone")}: ${t("notAdded")}</div>`}</div>${hasPhone()?"":`<span class="b sm" style="color:var(--info)">${t("add")}</span>`}<span class="chev">${ic.chev}</span></div>
      <div class="row" onclick="${hasEmail()?"push('profile')":"startMethod('add','email')"}"><span>✉</span><div class="l">${hasEmail()?`<div class="b">${maskEmail(S.email)}</div><div class="badge ver">✓ ${t("verified")}</div>`:`<div class="mute">${t("email")}: ${t("notAdded")}</div>`}</div>${hasEmail()?"":`<span class="b sm" style="color:var(--info)">${t("add")}</span>`}<span class="chev">${ic.chev}</span></div></div>${nudge}`;
    }
    h+=`<div class="hd">${t("myListings")}</div><div class="card">${[["active",L.a],["drafts",L.d],["sold",L.s],["archived",L.r]].map(([k,n])=>`<div class="row" onclick="push('listingsStub')"><div class="l">${t(k)}</div><span class="mute">${out?"–":n}</span><span class="chev">${ic.chev}</span></div>`).join("")}</div><div class="pad">${btn("＋ "+t("listCar"),"reset('sell')")}</div>`;
  }else{ /* C: Auto.ru-style menu list, Settings merged in */
    if(out)h+=signCard;
    else h+=`<div class="card row" onclick="push('profile')">${avatar(56,S.name)}<div class="l"><div class="b" style="font-size:17px">${S.name||idLabel()}</div><div class="mute sm">${t("profile")}</div></div><span class="chev">${ic.chev}</span></div>${nudge}`;
    const mr=(i,l,fn,x="")=>`<div class="row" onclick="${fn}"><span style="width:24px;text-align:center;color:var(--mfg)">${i}</span><div class="l">${l}</div>${x}<span class="chev">${ic.chev}</span></div>`;
    h+=`<div class="card">${signed()?mr("☰",t("myListings"),"push('listingsStub')")+mr("🔔",t("notifs"),"push('notifs')"):""}${mr("🌐",t("language"),"S.picker='lang';render()",`<span class="mute sm">${S.lang.toUpperCase()}</span>`)}${mr("◐",t("theme"),"S.picker='theme';render()",`<span class="mute sm">${t(S.theme)}</span>`)}</div>
    <div class="card">${mr("🛡",t("privacy"),"openLegal('privacy')")}${mr("📄",t("terms"),"openLegal('terms')")}${mr("📋",t("posting"),"openLegal('terms')")}</div>
    ${signed()?`<div class="card">${mr("🗑",t("deleteAcc"),"push('delete')")}</div><div class="pad">${btn(t("logout"),"S.dlg='logout';render()","out")}</div>`:""}`;
  }
  return h;

  opts:{A:["Identity card + My listings","Today, refined: one identity card (taps into Profile), a My listings row, a List a car button. Email-only Users get an “Add a phone to sell” card. Least API change."],
        B:["Kolesa-style cabinet","Profile row, then the phone and email rows right on Cabinet (verified ticks, “Add” when missing), then My listings split into Active / Drafts / Sold / Archived with counts, then List a car. Shows both Sign-in Methods without opening Profile. Needs per-status counts (the My listings screen already groups by status)."],
        C:["Auto.ru-style menu list","Cabinet becomes the whole menu: identity row, My listings, Notifications, Language, Theme, legal rows, Delete account, Log out. No separate Settings screen (the gear disappears). Fewest taps to a setting, but Cabinet gets long and Delete account sits one tap from the top level."]}},
 entry:{name:"Sign-in entry (phone or email)",ref:"AR-43-001/002 (Auto.ru chooses a method first); KZ-29-001; #387; approved map “equal entry points”",rec:"B",screen:()=>{S.acct="out";reset("cabinet");startSignIn();},
  opts:{A:["Phone | Email tabs (today)","Both fields one tap apart under a segmented control. This is what apps/mobile ships today (SignInMethodTabs). Defaults to Phone, so email feels secondary."],
        B:["Two equal buttons first","“Continue with phone” and “Continue with email” as equals, then the matching field. One extra tap but nothing is the default; matches the approved map wording and Auto.ru's method-first entry."],
        C:["One field, auto-detect","A single “Phone or email” field; digits mean phone, an @ means email. Fewest taps, but +993 is the only valid phone, so a foreign number or a typo gives a confusing error, and the field cannot show the +993 prefix."]}},
 sell:{name:"Selling blocked without a verified phone",ref:"ADR-0054 (Sell entry shows an “Add a phone” step); #344; #388",rec:"A",screen:()=>{S.acct="email";reset("sell");},
  opts:{A:["Gate before the wizard","An email-only User opening Sell sees “Add a phone to sell” and nothing else until a phone is confirmed, then lands back in Sell. No wasted effort, but the User learns about the rule before they see the wizard."],
        B:["Gate at Publish","The wizard is open to everyone; Publish on the last step shows “Add a phone to publish” (the PHONE_REQUIRED path). The draft is kept. More effort lost if they refuse, but the server rule is still needed as backup."]}},
 set:{name:"Settings structure",ref:"AR-41-004, AR-42-001 (drill-down menu rows); KZ-35-001, KZ-38-001 (Kolesa settings with values); today settings.tsx",rec:"A",screen:()=>{S.acct=signed()?S.acct:"both";reset("cabinet");push("settings");},
  opts:{A:["Inline controls (today)","Language and theme are three-way segmented controls shown on the page: one tap to change, no sub-screens. Three options each, so it fits."],
        B:["Drill-down rows","Rows show the current value (“Language  English ›”) and open a bottom sheet to pick. Matches Auto.ru/Kolesa, but every change is two taps."]}},
 chg:{name:"Warning before Change",ref:"KZ-32-003 (“After changing the phone you must use the new number”); ADR-0054 (old value freed immediately)",rec:"B",screen:()=>{openAs("both","profile");if(S.v.chg==="B"){S.sheet={t:"chg",type:"phone"};render();}else startMethod("change","phone");},
  opts:{A:["Straight to the new value (today)","Tapping Change opens the new-value screen; the helper line already says the old value stops working."],
        B:["Confirm sheet first","A short sheet says the old value stops opening the account and listings/chats stay. One extra tap on a rare action, and it prevents a lockout surprise."]}},
 taken:{name:"Value already used by another User",ref:"ADR-0054 (refused after the code is confirmed, SIGN_IN_METHOD_TAKEN, never merged); #388",rec:"A",screen:()=>{openAs("phone","profile");S.outcome="taken";startMethod("add","email");},
  opts:{A:["Refuse and offer another value","Plain explanation plus “Use a different email/number”. States that accounts are never merged. Nothing that looks like a merge offer (#388)."],
        B:["Also: sign out and use that account","Adds a second button that signs the User out and opens sign-in, so they can switch to the other account. Helpful, but it can read as a merge path and loses the current session."]}},
 del:{name:"Delete account confirmation (in app)",ref:"ADR-0032, ADR-0054 (DELETE /me unchanged; web page uses a code); KZ-48-002 (understand checkbox); AR-40/41 none",rec:"A",screen:()=>{S.acct="both";reset("cabinet");push("settings");push("delete");},
  opts:{A:["Checkbox + dialog (ADR as written)","List of what happens, an “I understand” checkbox, then the destructive button and a confirm dialog. The session already proves identity, so no code. Spends no SMS/email budget."],
        B:["Checkbox + dialog + code","After the dialog a Sign-in Code goes to the phone or email on file and must be entered. Stronger against a stolen unlocked phone, but changes ADR-0054's “DELETE /me unchanged”, costs a code from the shared 5-per-day budget, and fails if email delivery fails."]}},
};
const DKEYS=Object.keys(DEC);
function setV(k,o){S.v[k]=o;S.dec=k;DEC[k].screen();}
function cycle(d){const k=S.dec,ks=Object.keys(DEC[k].opts),i=(ks.indexOf(S.v[k])+d+ks.length)%ks.length;setV(k,ks[i]);}
function nextDec(){const i=(DKEYS.indexOf(S.dec)+1)%DKEYS.length;S.dec=DKEYS[i];DEC[S.dec].screen();}
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);});
function switcher(){
  const d=DEC[S.dec],o=d.opts[S.v[S.dec]];
  document.getElementById("switcher").innerHTML=`<button onclick="cycle(-1)">←</button><span class="lbl">D${DKEYS.indexOf(S.dec)+1} ${d.name}: ${S.v[S.dec]} — ${o[0]}${d.rec===S.v[S.dec]?" ★":""}</span><button onclick="cycle(1)">→</button><button onclick="nextDec()">next decision ▸</button>`;
}

/* ───────────── jumps (every state is one click) ───────────── */
const J=[];const grp=n=>J.push({g:n});const jp=(l,f)=>J.push({l,f});
const openAs=(acct,id)=>{S.acct=acct;S.data="ok";S.flow=null;S.sheet=S.dlg=S.web=S.picker=null;reset("cabinet");if(id&&id!=="cabinet")push(id);};
const codeFlow=(kind,type,extra={})=>{S.flow=Object.assign({kind,type,val:type==="phone"?"60 00-00-00":"name@example.com",err:null,code:"",cerr:null,sec:15,resends:0,step:"code",back:[{id:"cabinet"},{id:"profile"}]},extra);};
grp("Cabinet");
jp("Signed out",()=>openAs("out"));jp("Phone only",()=>openAs("phone"));jp("Email only",()=>openAs("email"));jp("Phone + email",()=>openAs("both"));
jp("Loading",()=>{openAs("both");S.data="loading";render();});jp("Error",()=>{openAs("both");S.data="error";render();});
grp("Sign in");
jp("Entry",()=>{openAs("out");startSignIn();});
jp("Code sent: phone",()=>{openAs("out");S.ret=[{id:"cabinet"}];codeFlow("signin","phone");S.stack=[{id:"cabinet"},{id:"signin"},{id:"code"}];render();});
jp("Code sent: email",()=>{openAs("out");S.ret=[{id:"cabinet"}];codeFlow("signin","email");S.stack=[{id:"cabinet"},{id:"signin"},{id:"code"}];render();});
jp("Invalid value",()=>{openAs("out");startSignIn();S.flow.step="entry";S.flow.val=S.v.entry==="C"?"61 0":"";S.flow.err="invalid";render();});
jp("Rate limited (request)",()=>{openAs("out");startSignIn();S.flow.step="entry";S.flow.val="60 00-00-00";S.flow.err="rate";render();});
jp("Offline (request)",()=>{openAs("out");startSignIn();S.flow.step="entry";S.flow.val="60 00-00-00";S.flow.err="offline";render();});
const codeErr=(e,type)=>{openAs("out");S.ret=[{id:"cabinet"}];codeFlow("signin",type);S.flow.cerr=e;if(e==="expired")S.flow.sec=0;S.stack=[{id:"cabinet"},{id:"signin"},{id:"code"}];render();};
jp("Wrong code",()=>codeErr("wrong","phone"));jp("Expired code",()=>codeErr("expired","email"));jp("Locked (5 wrong)",()=>codeErr("locked","phone"));
jp("Daily limit (5 codes)",()=>codeErr("rateDay","phone"));
jp("Email not delivered",()=>{codeErr(null,"email");S.flow.sec=0;S.flow.nomail=true;render();});
jp("Restore prompt (grace)",()=>{openAs("out");S.ret=[{id:"cabinet"}];codeFlow("signin","phone");S.flow.code="";S.stack=[{id:"cabinet"},{id:"signin"},{id:"code"}];S.outcome="grace";render();});
grp("Profile and Sign-in Methods");
jp("Profile: phone only",()=>openAs("phone","profile"));jp("Profile: email only",()=>openAs("email","profile"));jp("Profile: both",()=>openAs("both","profile"));
jp("Profile loading",()=>{openAs("both","profile");S.data="loading";render();});jp("Profile error",()=>{openAs("both","profile");S.data="error";render();});
jp("Add email: entry",()=>{openAs("phone","profile");startMethod("add","email");});
jp("Add phone: entry",()=>{openAs("email","profile");startMethod("add","phone");});
jp("Add: code sent",()=>{openAs("phone","profile");codeFlow("add","email");S.stack=[{id:"cabinet"},{id:"profile"},{id:"methodEntry"},{id:"code"}];render();});
jp("Add: wrong code",()=>{openAs("phone","profile");codeFlow("add","email");S.flow.cerr="wrong";S.stack=[{id:"cabinet"},{id:"profile"},{id:"methodEntry"},{id:"code"}];render();});
jp("Add: expired",()=>{openAs("phone","profile");codeFlow("add","email");S.flow.cerr="expired";S.flow.sec=0;S.stack=[{id:"cabinet"},{id:"profile"},{id:"methodEntry"},{id:"code"}];render();});
jp("Add: value taken (email)",()=>{openAs("phone","profile");codeFlow("add","email");S.stack=[{id:"cabinet"},{id:"profile"},{id:"methodEntry"},{id:"taken"}];render();});
jp("Add: value taken (phone)",()=>{openAs("email","profile");codeFlow("add","phone");S.stack=[{id:"cabinet"},{id:"profile"},{id:"methodEntry"},{id:"taken"}];render();});
jp("Change phone: sheet/entry",()=>{openAs("both","profile");S.v.chg==="B"?(S.sheet={t:"chg",type:"phone"},render()):startMethod("change","phone");});
grp("Selling");
jp("Email-only opens Sell",()=>{openAs("email");reset("sell");});
jp("Phone User opens Sell",()=>{openAs("phone");reset("sell");});
jp("Publish blocked (variant B)",()=>{S.v.sell="B";openAs("email");reset("sell");S.sheet={t:"phoneReq"};render();});
jp("Signed out opens Sell",()=>{openAs("out");reset("sell");});
grp("Settings");
jp("Settings: signed out",()=>openAs("out","settings"));jp("Settings: signed in",()=>openAs("both","settings"));
jp("Language sheet",()=>{openAs("both","settings");S.picker="lang";render();});
jp("Notifications",()=>{openAs("both","settings");S.notif.os="granted";push("notifs");});jp("Notifications: OS off",()=>{openAs("both","settings");S.notif.os="denied";push("notifs");});
jp("Legal page (web)",()=>{openAs("both","settings");openLegal("privacy");});
grp("Account");
jp("Log out dialog",()=>{openAs("both","settings");S.dlg="logout";render();});
jp("Delete: intro",()=>{openAs("both","settings");push("delete");});
jp("Delete: confirm dialog",()=>{openAs("both","settings");push("delete");S.delChecked=true;S.dlg="delete";render();});
jp("Delete: failed",()=>{openAs("both","settings");push("delete");S.delChecked=true;S.delFailed=true;render();});
jp("Delete: code (variant B)",()=>{S.v.del="B";openAs("both","settings");push("delete");codeFlow("delete","phone");S.stack.push({id:"code"});render();});
jp("Delete: scheduled",()=>{openAs("out");push("scheduled");});
jp("Web deletion page",()=>{openAs("out");S.flow={kind:"webdelete",type:"phone",val:"",err:null,step:"entry"};push("webDelete");});
jp("Web: code sent",()=>{openAs("out");codeFlow("webdelete","email");S.stack.push({id:"webDelete"});render();});
jp("Web: done",()=>{openAs("out");S.flow={kind:"webdelete",type:"email",val:"name@example.com",step:"done"};push("webDelete");});

/* ───────────── panel ───────────── */
function seg(items,cur,fn){return `<div class="seg">${items.map(([k,n])=>`<button class="${cur===k?"on":""}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`;}
window.pAcct=k=>{S.acct=k;S.data="ok";setAcctReset();};function setAcctReset(){render();}
window.pLang=k=>{S.lang=k;render();};window.pTheme=k=>{S.theme=k;render();};window.pOs=k=>{S.os=k==="dark";render();};
window.pOut=k=>{S.outcome=k;render();};window.pReq=k=>{S.req=k;render();};window.pDel=k=>{S.delOut=k;render();};window.pData=k=>{S.data=k;render();};
window.pDec=(k,o)=>setV(k,o);
const STATES=[
 ["Cabinet: signed out / phone only / email only / both","Cabinet jumps","apps/mobile/app/(tabs)/services.tsx","exists (A-like); B and C layouts, status counts, “Add a phone” card are new"],
 ["Cabinet loading / error","Cabinet jumps","services.tsx (spinner and text only)","exists; skeleton + Retry button new"],
 ["Sign-in entry: phone / email","Sign in → Entry","app/(auth)/phone.tsx, email.tsx, components/auth/AuthEntryScreen.tsx, SignInMethodTabs.tsx","exists (tabs). Method-first chooser and single field are new"],
 ["Code entry (sent, countdown, resend)","Sign in → Code sent","components/auth/CodeEntryForm.tsx, app/(auth)/otp.tsx","exists. Phone “expires in 5 minutes” line is new (email 10 min exists)"],
 ["Invalid value","Sign in → Invalid value","phoneFormatError / emailFormatError in resources.ts","exists"],
 ["Rate limited on request / on resend","Sign in → Rate limited","rateLimitedCode in resources.ts","exists; daily 5-code limit copy is new"],
 ["Offline on request / verify","Sign in → Offline","offline in resources.ts","exists"],
 ["Wrong / expired / locked code","Sign in → Wrong, Expired, Locked","src/auth/verifyCodeError.ts","exists (all three)"],
 ["Email not delivered hint","Sign in → Email not delivered","none","new (ADR-0055: bounces fail silently)"],
 ["Restore prompt on sign-in in grace","Sign in → Restore prompt","restoreAccount* strings in resources.ts","strings exist; verify the dialog is wired in app code"],
 ["Profile: phone only / email only / both","Profile jumps","apps/mobile/app/profile.tsx","exists. “Selling needs a verified phone” note is new"],
 ["Profile loading / error","Profile loading, error","profile.tsx (LoadingState, ErrorState)","exists"],
 ["Add phone / Add email entry","Profile → Add jumps","app/account/add-phone.tsx, add-email.tsx","exists"],
 ["Add/change: code sent, wrong, expired","Profile → Add: code sent, wrong, expired","app/account/verify-sign-in-method.tsx + CodeEntryForm","exists"],
 ["Value taken by another User","Profile → Add: value taken","SIGN_IN_METHOD_TAKEN → phoneTaken/emailTaken in verifyCodeError.ts","exists (variant A). Variant B button is new"],
 ["Change phone/email (+ warning sheet)","Profile → Change phone","add-phone.tsx (change mode)","exists; warning sheet is new (decision D5)"],
 ["Selling blocked without a phone","Selling jumps","app/(tabs)/sell.tsx (no phone check today; ADR-0054 / #388 pending)","new"],
 ["Publish blocked (PHONE_REQUIRED)","Selling → Publish blocked","none","new"],
 ["Settings: language, theme, legal links","Settings jumps","apps/mobile/app/settings.tsx","exists (A). Links must move to autotm.bagtyyar.dev (#496; today hardcodes auto.tm)"],
 ["Language RU/TK/EN, theme light/dark/system","Settings, floating bar, panel","LocaleSwitcher, ThemeSwitcher in apps/mobile/src","exists"],
 ["Notifications settings screen","Settings → Notifications","none in mobile (PRD docs/prd/features/36-notifications.md “Profile → Notifications”)","new. Categories trimmed to Messages + Listing activity"],
 ["Notifications OS-permission off","Settings → Notifications: OS off","none","new"],
 ["Log out + confirm","Account → Log out dialog","settings.tsx","exists"],
 ["Delete account intro + confirm + scheduled","Account → Delete jumps","apps/mobile/app/account/delete.tsx","exists. “What happens” list and understand checkbox are new"],
 ["Delete failed","Account → Delete: failed","delete.tsx (deleteAccountFailed)","exists"],
 ["Delete confirmed by code (variant B)","Account → Delete: code","none","new (would change ADR-0054)"],
 ["Web deletion page (phone or email code)","Account → Web deletion","none; #386 API, #389 page open","new"],
];
function panel(){
  const d=DEC[S.dec];const cur=S.v[S.dec];
  let h=`<h1>PROTOTYPE — Cabinet, Profile, Settings and sign-in methods</h1><div class="sm" style="color:#555">Throwaway (issue #353). Everything in the phone is clickable; the jump buttons set up any state in one click. ← → flip the variant of the current decision. All phone numbers, emails and codes are made up; type any six digits as a code. Resend countdown is 15 s here (60 s backoff in the product).</div>
  <h2>Account state</h2>${seg([["out","Signed out"],["phone","Phone only"],["email","Email only"],["both","Phone + email"]],S.acct,"pAcct")}
  <h2>Language / theme</h2>${seg([["en","EN"],["ru","RU"],["tk","TK"]],S.lang,"pLang")} ${seg([["light","Light"],["dark","Dark"],["system","System"]],S.theme,"pTheme")} <span class="sm">device is</span> ${seg([["light","light"],["dark","dark"]],S.os?"dark":"light","pOs")}
  <h2>Next result (one-shot, then back to OK)</h2>
  <div class="q">Code check ${seg([["ok","Accept"],["wrong","Wrong"],["expired","Expired"],["locked","Locked"],["offline","Offline"],["taken","Value taken (add/change)"],["grace","Grace period (sign-in)"]],S.outcome,"pOut")}</div>
  <div class="q">Get code / resend ${seg([["ok","Sent"],["rate","Rate limited"],["rateDay","Daily limit"],["offline","Offline"]],S.req,"pReq")}</div>
  <div class="q">Delete account ${seg([["ok","Succeeds"],["fail","Fails"]],S.delOut,"pDel")} &nbsp; Data load ${seg([["ok","OK"],["loading","Loading"],["error","Error"]],S.data,"pData")}</div>
  <h2>Jump to a state</h2>`;
  J.forEach((j,i)=>{h+=j.g?`<div class="grp">${j.g}</div>`:`<span class="jump" onclick="J[${i}].f()">${j.l}</span>`;});
  h+=`<h2>Decision D${DKEYS.indexOf(S.dec)+1}: ${d.name}</h2><div class="q sm">Reference: ${d.ref}</div>`;
  h+=Object.entries(d.opts).map(([k,o])=>`<div class="vdesc" style="${cur===k?"":"opacity:.55"}"><b>${k}. ${o[0]}</b>${d.rec===k?'<span class="rec">recommended</span>':""}<br>${o[1]}</div>`).join("");
  h+=seg(Object.entries(d.opts).map(([k,o])=>[k,k+" "+o[0]]),cur,`(k=>pDec('${S.dec}',k))`);
  h+=`<div style="margin-top:8px">${DKEYS.map((k,i)=>`<span class="jump" style="${k===S.dec?"background:#171717;color:#fff":""}" onclick="S.dec='${k}';DEC['${k}'].screen()">D${i+1} ${DEC[k].name}</span>`).join("")}</div>`;
  h+=`<h2>Open points with no variant</h2><div class="q sm">• Web deletion confirmation copy is neutral (“If an account uses this phone…”) because ADR-0054 says a code request never reveals whether a value is registered. Say if you want it explicit.<br>• Phone codes expire in 5 min, email in 10 (ADR-0054); the phone line is new in the UI.<br>• Display name: not editable in the app today (Kolesa KZ-31 has Edit name). Left out; no ticket asks for it.<br>• Notification categories trimmed to Messages and Listing activity. Saved-search, blog and marketing categories in PRD 36 are out of the release.<br>• Language switcher stays on the sign-in screen (as today).</div>`;
  h+=`<details ${S.o1?"open":""} ontoggle="S.o1=this.open"><summary>State inventory: where in the prototype, exists today or new</summary><table><tr><th>State</th><th>Where here</th><th>Today (file)</th><th>Status</th></tr>${STATES.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3].startsWith("new")?"new":/new|pending|verify/.test(r[3])?"chg":"have"}">${r[3]}</td></tr>`).join("")}</table></details>`;
  h+=`<details ${S.o2?"open":""} ontoggle="S.o2=this.open"><summary>Reference notes (batches 3 and 4, viewed locally, not copied)</summary><div class="q sm">
  • AR-41-002/004: Auto.ru “Menu” is a sheet of service tiles (wallet, reports, garage, insurance, credit) above a plain list: notifications, theme, help, licence agreement, privacy, about. Tiles are out of scope (rejected: credit, history reports, garage). The plain list is the part to copy (variant C).<br>
  • AR-43-002: sign-in is a sheet that chooses an account provider; AutoTM has no social sign-in, so the useful part is only “choose a method first” (variant B).<br>
  • AR-44-001: profile header is a banner with name and a settings gear; social counters and Garage are out of scope.<br>
  • AR-40-002: notification settings group by topic with a channel summary under each row; we use switches because there is one channel (push).<br>
  • KZ-27-003 / KZ-35-001: cabinet shows name, the login phone as a row with a chevron, then My listings by status with counts, then the primary post button; settings are grouped Personal data, App settings, Push (variants B and A). Balance, PLUS and car history are out of scope.<br>
  • KZ-32-003: changing the phone shows a sheet saying the new number must be used to sign in (decision D5).<br>
  • KZ-48-002: delete screen lists what will be lost and requires an “I understand” checkbox before the red button (decision D7). Kolesa deletes immediately; AutoTM has a 30-day grace (ADR-0032), so the copy says so.<br>
  • Not opened: AR-42-002..4, AR-43-001/3/5, AR-44-002/3, AR-40-003..8, KZ-28/29 detail, KZ-31, KZ-37, KZ-38, KZ-41..44, KZ-52 (register/login/password flows, edit name, contacts, language, legal pages, onboarding video). KZ-28/29/30/36 are password flows and are rejected for AutoTM.</div></details>`;
  document.getElementById("panel").innerHTML=h;
}
render();
</script>
