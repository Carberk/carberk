<!--
  PROTOTYPE — throwaway. Issue #353 "Prototype Cabinet, Profile, Settings, and sign-in method screens", third version.
  The founder rejected the version at a051faf (2026-10-02, second round): Profile and Settings should follow Auto.ru and be
  minimal, Contact support was overused, and the selling functions the Cabinet references must be thought through first.
  This version: one plain menu list in Auto.ru's manner (AR-41-004), Help exactly once in that list, and a seller-function
  inventory read from origin/main that drives the My listings entry. The My listings screen here is a stub; #354 owns it.
  Locked and unchanged: Phone | Email sign-in tabs by code, one User, no password/social/merge; add/change after a code;
  no account-phone gate to sell (ADR-0056); in-app deletion by session, web deletion by code, 30-day grace with explicit
  restore (ADR-0032, ADR-0054); host autotm.bagtyyar.dev, route /:locale/account/delete; no Share; no notification
  category switches; five tabs. Everything else here is a proposal for the founder. Recommendations are not approvals.
  Account values and codes are made up. Support contacts are the founder-approved public contacts (#352 D10).
  Colours are AutoTM tokens from apps/mobile/global.css. Auto.ru is a structure reference, not a visual template (ADR-0051).
  New RU/TK wording needs founder review.
  Profile identity update (2026-10-02, on top of 8402d60): the founder approved D1–D8 and then asked for an editable,
  randomly assigned display name, a profile photo, and a small car-themed avatar library AutoTM assigns until a photo is
  set (#353 comment 5947334041, #344 amendment 5947347989). D1–D8 stay at their approved options. Decisions N1–N8 are new
  proposals; ★ marks a recommendation, never an approval. The twelve avatars are inline SVG drawn for this file.
  Notes: cabinet-profile.identity.md.
-->

const maskPhoneDisp=p=>{const raw=p.replace(/\D/g,"");const d=raw.startsWith("993")?raw.slice(3):raw;return "+993 "+d[0]+"• ••-••-"+d.slice(-2);};

function liveVal(el){
  const f=S.flow;let v=el.value;
  if(f.type==="phone"){v=fmtPhone(v.replace(/^\+?993/,""));el.value=v;}
  f.val=v;f.err=null;
}
function demoFill(){const f=S.flow;f.val=f.type==="phone"?"60 00-00-00":"name@example.com";f.err=null;render();}
function getCode(){
  const f=S.flow;let type=f.type;
  let val=f.val.trim();
  const phoneish=type==="phone";
  const ok=phoneish?validPhone(val):validEmail(val);
  if(!ok){f.err="invalid";f.type=type;render();return;}
  const r=S.req;S.req="ok";
  if(r==="offline"){f.err="offline";render();return;}
  if(r==="rate"){f.err="rate";render();return;}
  if(r==="rateDay"){f.err="rateDay";render();return;}
  f.type=type;f.val=phoneish?val:val.toLowerCase();f.err=null;f.code="";f.cerr=null;f.sec=15;f.resends=0;f.nomail=false;
  if(f.kind==="webdelete"){f.step="code";render();}else push("code");
}
function key(d){
  const f=S.flow;if(!f||["locked","expired","rateDay"].includes(f.cerr)||f.busy)return;
  f.code=f.code||"";
  if(d==="<"){f.code=f.code.slice(0,-1);f.cerr=null;render();return;}
  if(f.code.length>=6)return;
  f.code+=d;f.cerr=null;render();
  if(f.code.length===6){f.busy=true;setTimeout(submitCode,350);}
}
function submitCode(){
  const f=S.flow;if(!f)return;f.busy=false;
  let o=S.outcome;S.outcome="ok";
  if(o==="taken"&&!(f.kind==="add"||f.kind==="change"))o="ok";
  if(o==="grace"&&f.kind!=="signin")o="ok";
  if(o==="wrong"||o==="expired"||o==="locked"||o==="offline"){f.cerr=o;f.code="";render();return;}
  if(o==="taken"){S.stack.pop();push("taken");return;}
  success(o==="grace");
}
function success(grace){
  const f=S.flow;
  if(f.kind==="signin"){
    const previous=S.savedAccount;
    if(grace&&matchesAccount(previous,f)&&!S.deletionPending){S.deletedAccount={...previous};S.deletionPending=true;}
    const recovering=S.deletionPending&&matchesAccount(S.deletedAccount,f);
    const account=recovering?S.deletedAccount:matchesAccount(previous,f)?previous:{acct:f.type,phone:f.type==="phone"?"+993 "+f.val:null,email:f.type==="email"?f.val:null,...freshIdentity()}; /* a new User gets an assigned name and avatar at creation (N1, N4) */
    S.stack=S.ret;S.flow=null;S.restoreAccount=null;S.dlg=null;S.histories={};
    if(recovering){S.restoreAccount={...account};S.acct="out";S.dlg="restore";render();}
    else{Object.assign(S,account);S.savedAccount=mockAccount();toast(t("signedIn"));}
  }else if(f.kind==="add"||f.kind==="change"){
    if(f.type==="phone")S.phone="+993 "+f.val;else S.email=f.val;
    S.acct=f.type==="phone"?(hasEmail()?"both":"phone"):(hasPhone()?"both":"email");S.savedAccount=mockAccount();S.stack=f.back;S.flow=null;toast((f.kind==="add"?t("added"):t("changed"))+": "+dest(f.type,f.type==="phone"?S.phone:S.email));
  }else if(f.kind==="webdelete"){f.step="done";render();}
}
function resend(){
  const f=S.flow;if(f.sec>0)return;
  const r=S.req;S.req="ok";
  if(r==="rateDay"||f.resends>=4){f.cerr="rateDay";render();return;}
  if(r==="rate"){f.cerr="rate";render();return;}
  if(r==="offline"){f.cerr="offline";render();return;}
  f.resends++;f.sec=15;f.code="";f.cerr=null;toast(t("otpSent",{d:dest(f.type,f.val)}));
}
function backFromCode(){const f=S.flow;f.code="";f.cerr=null;if(f.kind==="webdelete"){f.step="entry";render();}else if(f.kind==="delete"){S.flow=null;pop();}else pop();}
setInterval(()=>{const f=S.flow;if(f&&f.sec>0&&(topScreen().id==="code"||(topScreen().id==="webDelete"&&f.step==="code"))){f.sec--;renderPhone();}},1000);

function doDelete(){

}

const RESERVED=["autotm","support","admin","administrator","moderator","official","поддержка","админ","администратор","модератор","официальный","goldaw","dolandyryjy","resmi","автотм"];
function nameError(raw){
  const v=raw.replace(/\s+/g," ").trim();
  if(!v)return "nmEmpty";
  if([...v].length<2)return "nmShort";
  if([...v].length>30)return "nmLong";
  if(!/^[\p{L}\p{M}0-9 .'’-]+$/u.test(v))return "nmChars";
  if((v.match(/[0-9]/g)||[]).length>4)return "nmDigits";
  const flat=v.toLowerCase().replace(/[\s.'’-]/g,"");
  if(RESERVED.some(r=>flat.includes(r)))return "nmReserved";
  return null;
}

let upTimer=null,upToken=0;
function runUpload(){
  const tok=++upToken;S.up={stage:"compress",p:0,src:S.up?.src||"gallery"};render();
  const step=()=>{
    if(tok!==upToken||!S.up)return;
    const u=S.up;
    if(u.stage==="compress"){u.stage="upload";u.p=0;render();upTimer=setTimeout(step,260);return;}
    if(u.stage==="upload"&&u.p<100){
      const o=S.upOut;
      if(u.p>=50&&(o==="fail"||o==="offline")){S.upOut="ok";u.stage="fail";u.err=o==="offline"?"offline":"uploadFail";render();return;}
      if(u.p>=75&&o==="bad"){S.upOut="ok";u.stage="fail";u.err="photoBad";render();return;}
      u.p+=25;render();upTimer=setTimeout(step,260);return;
    }
    S.upOut="ok";S.up=null;S.photo=true;S.photoPending=S.v.n5==="B";S.savedAccount=mockAccount();toast(t("photoUpdated"));
  };
  upTimer=setTimeout(step,650);
}

 n1:{id:"N1",name:"Assigned name format",ref:"Founder 2026-10-02 (#353 comment 5947334041); AR-37-002, AR-11-010 (Auto.ru shows a first name); KZ-31-002 (Kolesa “Имя на Kolesa.kz”)",rec:"A",go:()=>{openAs("both","profile");},

const DKEYS=Object.keys(DEC);

function setV(k,o){if(!DEC[k].opts[o])return;S.v[k]=o;S.dec=k;DEC[k].go();}
function cycle(d){const k=S.dec,ks=Object.keys(DEC[k].opts),i=(ks.indexOf(S.v[k])+d+ks.length)%ks.length;setV(k,ks[i]);}
function nextDec(){const i=(DKEYS.indexOf(S.dec)+1)%DKEYS.length;S.dec=DKEYS[i];DEC[S.dec].go();}
document.addEventListener("keydown",e=>{if(e.target.closest&&e.target.closest("input,textarea"))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);});
function switcher(){
  const d=DEC[S.dec],o=d.opts[S.v[S.dec]];
  document.getElementById("switcher").innerHTML=`<button onclick="cycle(-1)">←</button><span class="lbl">${d.id} ${d.name}: ${S.v[S.dec]} — ${o[0]}${d.rec===S.v[S.dec]?(d.ap?" ✓ approved":" ★ recommended"):""}</span><button onclick="cycle(1)">→</button><button onclick="nextDec()">next decision ▸</button>`;
}
