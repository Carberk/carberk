<!--
  PROTOTYPE — throwaway. Issue #354 "Prototype the Sell wizard, drafts, and My listings states".
  Same technical and visual style as cabinet-profile.prototype.html at 8402d60 (#353): phone frame, control panel,
  EN/RU/TK, light/dark, jump states, decision switcher. Auto.ru is a structure reference, not a visual template (ADR-0051).
  Respected, not reopened: five tabs with Sell as a tab (#344); Cabinet has one "My listings" row with a total, My listings
  tabs are Active · Drafts · Archive with Sold folded into Archive, no "List a car" on Cabinet, bottom-sheet pickers, plain
  rows, Help used sparingly (#353, founder 2026-10-02); every Listing contact phone is verified by SMS and there is no
  account-phone gate to sell (ADR-0056); no Share anywhere (PR #499); Under review, Rejected and expiry are deferred;
  a sold Listing cannot return to active; a blocked Listing shows a label and has no actions.
  Everything else is a proposal. A ★ marks a recommendation, never an approval.
  All account values, numbers, cars and codes are made up. Photos are CSS gradients; no image is embedded.
  Colours are AutoTM tokens from apps/mobile/global.css. New RU and TK wording needs founder review.

function closeWz(msg){
  const W=S.w;clearTimeout(TM.save);clearTimeout(TM.up);
  if(W.mode==="create"){const i=S.drafts.indexOf(W.d);if(isEmptyDraft(W.d)){if(i>=0)S.drafts.splice(i,1);}else if(i<0)S.drafts.unshift(W.d);}
  S.stack=W.ret;S.w=null;S.cf=null;S.sheet=S.dlg=S.pk=null;render();if(msg)toast(msg);
}
function leaveWz(){
  const W=S.w;S.pk=null;
  if(W.mode==="edit"){if(W.dirty){S.dlg={t:"leaveEdit"};render();}else closeWz();return;}
  if(isEmptyDraft(W.d)){closeWz();return;}
  flushSave();
  if(W.save==="error"){S.dlg={t:"unsaved"};render();return;}
  if(S.v.leave==="B"){S.sheet={t:"leave"};render();return;}
  closeWz(t("savedToDrafts"));
}
function dropDraftNow(){const W=S.w,i=S.drafts.indexOf(W.d);if(i>=0)S.drafts.splice(i,1);W.d=car({});closeWz(t("draftDeleted"));}
function touch(){
  const W=S.w;W.dirty=true;
  if(W.mode!=="create")return;
  W.save="saving";setSaveLabel();clearTimeout(TM.save);TM.save=setTimeout(()=>{flushSave();setSaveLabel();},600);
}
function flushSave(){
  const W=S.w;if(!W||W.mode!=="create"||W.save==="idle"||W.save==="saved")return;
  clearTimeout(TM.save);
  const o=S.nx.save;
  if(S.net==="off"||o==="fail"){W.save="error";}else{W.save="saved";W.d.upd="dToday";}
}
function retrySave(){const W=S.w;S.nx.save="ok";W.save="saving";flushSave();S.dlg=null;render();}
function saveLabel(){
  const W=S.w;if(W.mode!=="create")return "";
  if(W.save==="saving")return t("saving");
  if(W.save==="error")return `<span class="bad" data-k="save-retry" onclick="retrySave()">${t("notSaved")}</span>`;
  if(W.save==="saved")return icon("check",13)+" "+t("saved");
  return "";
}
function setSaveLabel(){const el=document.getElementById("svst");if(el&&S.w)el.innerHTML=saveLabel();}
function scrTop(){const sc=document.getElementById("scr");if(sc)sc.scrollTop=0;}

/* ───────────── wizard: field edits ───────────── */
function setF(k,el){
  const d=S.w.d;let v=el.value;
  if(k==="km"||k==="price"||k==="hp"){const n=v.replace(/\D/g,"").slice(0,k==="price"?10:7);d[k]=n===""?"":Number(n);el.value=n===""?"":fmtNum(Number(n));if(k==="price"){const a=document.getElementById("approx");if(a)a.textContent=approxLine(d);}}
  else if(k==="vin"){v=v.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,17);d.vin=v;el.value=v;}
  else{d[k]=v;}
  if(k==="desc"){const c=document.getElementById("dcount");if(c)c.textContent=v.length+"/2000";}
  touch();
}
function setC(k,v){const d=S.w.d;d[k]=v;if(k==="cur"){d.price="";}if(k==="cond"&&v==="new"){d.km="";}touch();render();}
function tog(k){const d=S.w.d;d[k]=!d[k];touch();render();}
const approxLine=d=>d.cur!=="TMT"&&d.price!==""?t("approxTmt",{n:fmtNum(Math.round(d.price*CAT.fx[d.cur]))}):"";
function nextStep(){
  const W=S.w,s=steps()[W.i],e=stepErrs(s,W.d);
  if(Object.keys(e).length){W.tried[stepKey(s)]=true;render();return;}
  flushSave();
  if(W.save==="error"){render();return;}
  if(W.detour||W.mode==="edit"){W.detour=false;W.i=steps().length-1;}
  else{W.i++;W.d.at=steps()[W.i][0];}
  S.pk=null;W.pub=null;render();scrTop();
}
function backStep(){
  const W=S.w;S.pk=null;
  if(W.detour||(W.mode==="edit"&&W.i!==steps().length-1)){W.detour=false;W.i=steps().length-1;render();scrTop();return;}
  if(W.i===0||W.mode==="edit"){leaveWz();return;}
  flushSave();W.i--;W.pub=null;render();scrTop();
}
function goStep(i){const W=S.w;W.i=i;W.detour=true;W.pub=null;render();scrTop();}

/* ───────────── pickers ───────────── */
const PKT={brand:"brand",model:"model",year:"year",gen:"generation",body:"bodyType",gear:"transmission",eng:"engineType",drive:"driveType",color:"color",city:"city",region:"region"};
function openPk(k){S.pk={k,q:""};render();}
function pkItems(){
  const d=S.w.d,k=S.pk.k,q=S.pk.q.trim().toLowerCase(),f=a=>a.filter(x=>!q||x.label.toLowerCase().includes(q));
  if(k==="brand"){const all=CAT.brands.map(b=>({v:b,label:b}));if(q)return f(all);return [{hd:t("popular")}].concat(CAT.popular.map(b=>({v:b,label:b})),[{hd:t("allBrands")}],all);}
  if(k==="model")return f((CAT.models[d.brand]||[]).map(m=>({v:m,label:m})));
  if(k==="year")return YEARS.map(y=>({v:y,label:String(y)}));
  if(k==="gen")return gensOf(d).map(g=>({v:g,label:g})).concat([{v:"",label:t("skipGen"),mute:true}]);
  if(k==="color")return CAT.color.map(c=>({v:c[0],label:t(c[0]),hex:c[1]}));
  if(k==="region")return CAT.regions.map(r=>({v:r[0],label:t(r[0])}));
  if(k==="city"){
    if(S.v.city==="B")return (CAT.regions.find(r=>r[0]===d.region)||["",[]])[1].map(c=>({v:c,label:t(c)}));
    const out=[];CAT.regions.forEach(r=>{const cs=r[1].map(c=>({v:c,label:t(c)})).filter(x=>!q||x.label.toLowerCase().includes(q));if(cs.length){out.push({hd:t(r[0])});cs.forEach(c=>out.push(c));}});return out;
  }
  return CAT[k].map(x=>({v:x,label:t(x)}));
}
function pkPick(i){
  const W=S.w,d=W.d,k=S.pk.k,it=pkItems()[i];if(!it||it.hd)return;
  let nextK=null;
  if(k==="brand"){if(d.brand!==it.v){d.model="";d.gen="";}d.brand=it.v;if(!d.model)nextK="model";}
  else if(k==="model"){if(d.model!==it.v)d.gen="";d.model=it.v;if(!d.year)nextK="year";else if(gensOf(d).length&&!d.gen)nextK="gen";}
  else if(k==="year"){d.year=it.v;if(gensOf(d).length&&!d.gen)nextK="gen";}
  else if(k==="region"){if(d.region!==it.v)d.city="";d.region=it.v;if(!d.city)nextK="city";}
  else if(k==="city"){d.city=it.v;d.region=regionOf(it.v);}
  else d[k]=it.v;
  S.pk=nextK?{k:nextK,q:""}:null;touch();render();
}
function pkSearch(el){S.pk.q=el.value;const b=document.getElementById("pkbody");if(b)b.innerHTML=pkRows();}
function pkRows(){
  const d=S.w.d,k=S.pk.k,items=pkItems();
  if(!items.filter(x=>!x.hd).length)return `<div class="mute" style="text-align:center;padding:40px 16px">${t("noMatch")}</div>`;
  return `<div class="list plain">`+items.map((it,i)=>it.hd?`<div class="sect" style="padding-top:12px">${it.hd}</div>`:
    `<div class="row" data-k="pk-${i}" onclick="pkPick(${i})">${it.hex?`<span class="dot" style="background:${it.hex};width:22px;height:22px"></span>`:""}<span class="l"><span class="lb${it.mute?" mute":""}">${it.label}</span></span>${it.v!==""&&String(d[k])===String(it.v)?`<span style="display:flex;color:var(--primary)">${icon("check",20)}</span>`:""}</div>`).join("")+`</div>`;
}
function pkOverlay(){
  const k=S.pk.k,searchable=["brand","model","city"].includes(k)&&!(k==="city"&&S.v.city==="B");
  const srch=searchable?`<div class="pad" style="padding-bottom:6px;flex:none"><div class="field" style="height:46px;border-radius:12px;background:var(--secondary);border-color:transparent">${icon("search",18)}<input data-k="pk-search" placeholder="${t("search")}" value="${S.pk.q}" oninput="pkSearch(this)"></div></div>`:"";
  if(S.v.pick==="B")return `<div class="full" data-pk="${k}"><div class="appbar" style="flex:none"><button class="ib" aria-label="Back" data-k="pk-close" onclick="S.pk=null;render()">${icon("back")}</button><div class="t sm"></div><span class="sp"></span></div><div class="h1" style="flex:none">${t(PKT[k])}</div>${srch}<div class="bd" id="pkbody">${pkRows()}</div></div>`;
  return `<div class="dim" onclick="S.pk=null;render()"></div><div class="sheet" data-pk="${k}"><div class="hd"><div class="tt">${t(PKT[k])}</div><button class="ib" aria-label="Close" data-k="pk-close" onclick="S.pk=null;render()">${icon("x")}</button></div>${srch}<div class="bd" id="pkbody">${pkRows()}</div></div>`;
}

/* ───────────── photos and video ───────────── */
function addMedia(kind,n){
  const W=S.w,d=W.d;S.sheet=null;S.freeze=false;W.vidErr=null;
  if(kind==="video"){
    const o=S.nx.video;S.nx.video="ok";
    if(o==="long"){W.vidErr="vidLong";render();return;}
    d.video={id:"v"+(S.seq++),st:"compressing",hue:20,pct:0,plan:o==="large"?"vlarge":"ok",vid:true};
    touch();render();pump();return;
  }
  const room=MAXP-d.photos.length;
  if(room<=0){toast(t("maxPhotos"));return;}
  const k=Math.min(n,room),o=S.nx.photo;S.nx.photo="ok";
  for(let i=0;i<k;i++)d.photos.push({id:"p"+(S.seq++),st:"compressing",hue:(d.photos.length*47+205)%360,pct:0,plan:i===0?o:"ok"});
  touch();render();pump();
  if(k<n)toast(t("limitPartial",{n:k}));
}
function pump(){clearTimeout(TM.up);if(S.freeze||!S.w)return;if(!media(S.w.d).some(p=>INFL.includes(p.st)))return;if(S.net==="off"&&!media(S.w.d).some(p=>p.st==="compressing"))return;TM.up=setTimeout(()=>{tickUploads();afterTick();},450);}
function afterTick(){if(!S.w)return;const top=topScreen().id;if(top==="wizard"&&!S.pk&&!S.sheet&&!S.dlg&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))renderPhone();pump();}
function tickUploads(){
  if(!S.w)return;let slots=2;
  for(const p of media(S.w.d)){
    if(p.st==="compressing"){
      if(p.plan==="large"||p.plan==="vlarge"||p.plan==="missing"){p.st="failed";p.err=p.plan==="large"?"upLarge":p.plan==="vlarge"?"vidLarge":"upMissing";p.again=false;}
      else p.st=S.net==="off"?"waiting":"queued";
      continue;
    }
    if(p.st==="waiting"){if(S.net==="on")p.st="queued";continue;}
    if(p.st==="queued"){if(S.net==="off"){p.st="waiting";continue;}if(slots>0){slots--;p.st="uploading";p.pct=15;}continue;}
    if(p.st==="uploading"){
      slots--;
      if(S.net==="off"){p.st="waiting";continue;}
      p.pct+=45;
      if(["network","server","rate"].includes(p.plan)&&p.pct>50){p.st="failed";p.err={network:"upNetwork",server:"upServer",rate:"upRate"}[p.plan];p.again=true;p.plan="ok";continue;}
      if(p.pct>=100){p.st="done";p.pct=100;}
    }
  }
}
function drain(){if(!S.w)return;S.freeze=false;for(let i=0;i<40;i++)tickUploads();render();}
const findMedia=id=>media(S.w.d).find(p=>p.id===id);
function mediaAct(a,id){
  const d=S.w.d,p=findMedia(id);S.sheet=null;if(!p)return;
  const i=d.photos.indexOf(p);
  if(a==="retry"){p.st="queued";p.err=null;p.pct=0;S.freeze=false;}
  if(a==="remove"){if(p.vid)d.video=null;else d.photos.splice(i,1);}
  if(a==="cover"&&i>0){d.photos.splice(i,1);d.photos.unshift(p);}
  if(a==="earlier"&&i>0){d.photos.splice(i,1);d.photos.splice(i-1,0,p);}
  if(a==="later"&&i>=0&&i<d.photos.length-1){d.photos.splice(i,1);d.photos.splice(i+1,0,p);}
  touch();render();pump();
}
const tileBg=p=>`background:linear-gradient(135deg,hsl(${p.hue} 28% 58%),hsl(${(p.hue+35)%360} 34% 30%))`;
function tile(p,i){
  let ov="";
  if(p.st==="compressing")ov=`<div class="ov"><div class="spin"></div>${t("phCompress")}</div>`;
  if(p.st==="queued")ov=`<div class="ov">${icon("clock",18)}${t("phQueued")}</div>`;
  if(p.st==="uploading")ov=`<div class="ov"><div class="spin"></div>${t("phUploading")}<div class="bar"><i style="width:${p.pct}%"></i></div></div>`;
  if(p.st==="waiting")ov=`<div class="ov warnov">${icon("nowifi",18)}${t("phWaiting")}</div>`;
  if(p.st==="failed")ov=`<div class="ov warnov">${icon(p.again?"retry":"warn",18)}<b>${p.again?t("retry"):t("phFailed")}</b></div>`;
  if(p.st==="lost")ov=`<div class="ov warnov">${icon("warn",18)}<b>${t("phLost")}</b></div>`;
  return `<button class="ptile" data-k="tile-${p.id}" data-st="${p.st}" style="${tileBg(p)}" onclick="S.sheet={t:'media',id:'${p.id}'};render()">${p.vid?`<span class="nm">▶ 0:42</span>`:`<span class="nm">${i+1}</span>`}${!p.vid&&i===0?`<span class="cv">${t("cover")}</span>`:""}${p.vid&&p.st==="done"?`<span class="cv">${t("video")}</span>`:""}${ov}</button>`;
}
function upChip(){
  const W=S.w,m=media(W.d),f=m.filter(p=>p.st==="failed"||p.st==="lost").length,u=m.filter(p=>INFL.includes(p.st)).length;
  if(!f&&!u)return "";
  const go=`goPhotos()`;
  return (f?`<button class="upchip bad" data-k="chip-failed" onclick="${go}">${icon("warn",13)} ${t("chipFailed",{n:f})}</button> `:"")+(u?`<button class="upchip" data-k="chip-uploading" onclick="${go}">${icon("upload",13)} ${t("chipUploading",{n:u})}</button>`:"");
}
function goPhotos(){const W=S.w,i=stepIdx("photos");if(W.i===i)return;if(W.i===steps().length-1||W.mode==="edit")goStep(i);else{flushSave();W.i=i;render();scrTop();}}

/* ───────────── contact phone code flow (ADR-0056) ───────────── */
function startCf(purpose,pre,lid){S.sheet=null;S.cf={purpose,val:pre?pre.replace("+993 ",""):"",pre:!!pre,err:null,step:"entry",code:"",cerr:null,sec:15,resends:0,tries:0,lid:lid||null};push("cphone");}
function cfLive(el){const f=S.cf;el.value=fmtPhone(el.value);f.val=el.value;if(f.err){f.err=null;const e=document.getElementById("cferr");if(e)e.innerHTML="";}}
function cfFill(){S.cf.val="64 55-66-77";S.cf.err=null;render();}
function cfSend(){
  const f=S.cf;
  if(!validPhone(f.val)){f.err="invalid";render();return;}
  const no="+993 "+fmtPhone(f.val);
  if(f.purpose==="listing"&&((hasPhone()&&no===S.phoneNo)||S.vphones.some(v=>v.no===no&&v.days>0))){cfDone(no,true);return;}
  const o=S.nx.send;S.nx.send="ok";
  if(S.net==="off"||o==="offline"){f.err="offline";render();return;}
  if(o==="rate"||o==="rateDay"){f.err=o;render();return;}
  f.err=null;f.step="code";f.code="";f.cerr=null;f.sec=15;f.tries=0;
  if(topScreen().id!=="ccode")push("ccode");else render();
}
function cfKey(k){
  const f=S.cf;if(!f||["locked","expired","rateDay"].includes(f.cerr))return;
  if(k==="del"){f.code=f.code.slice(0,-1);f.cerr=null;renderPhone();return;}
  if(f.code.length>=6)return;
  f.code+=k;f.cerr=null;
  if(f.code.length===6)cfSubmit();else renderPhone();
}
function cfSubmit(){
  const f=S.cf;const o=S.nx.code;S.nx.code="ok";
  if(S.net==="off"||o==="offline"){f.cerr="offline";f.code="";render();return;}
  if(o==="wrong"){f.tries++;f.code="";f.cerr=f.tries>=5?"locked":"wrong";render();return;}
  if(o==="expired"||o==="locked"){f.cerr=o;f.code="";f.sec=0;render();return;}
  cfDone("+993 "+fmtPhone(f.val),false);
}
function cfResend(){
  const f=S.cf;if(f.sec>0&&!["expired","locked"].includes(f.cerr))return;
  const o=S.nx.send;S.nx.send="ok";
  if(S.net==="off"||o==="offline"){f.cerr="offline";render();return;}
  if(o==="rate"){f.cerr="rate";render();return;}
  if(o==="rateDay"){f.cerr="rateDay";render();return;}
  f.resends++;f.code="";f.cerr=null;f.tries=0;f.sec=15*Math.pow(2,f.resends);render();
}
function cfDone(no,shortcut){
  const f=S.cf;
  if(!shortcut){const v=S.vphones.find(x=>x.no===no);if(v)v.days=7;else S.vphones.push({no,days:7});}
  S.stack=S.stack.filter(x=>x.id!=="cphone"&&x.id!=="ccode");S.cf=null;
  if(f.purpose==="relist"){const l=S.listings.find(x=>x.id===f.lid);if(l){l.st="active";l.phone=no;}S.ltab="active";render();toast(t("tRelist"));return;}
  if(S.w){S.w.d.phone=no;S.w.pub=null;touch();}
  render();toast(t(shortcut?"alreadyOk":"numConfirmed"));
}
function cfBack(){const f=S.cf;if(topScreen().id==="ccode"){f.step="entry";f.code="";f.cerr=null;pop();}else{S.cf=null;pop();}}
function pickPhone(i){
  const d=S.w.d,p=phonePicks()[i];if(!p)return;
  if(p.ok){d.phone=p.no;touch();render();}else startCf("listing",p.no);
}
function phonePicks(){
  const W=S.w,d=W.d,out=[];
  if(hasPhone())out.push({no:S.phoneNo,sub:t("acctPhoneSub"),ok:true});
  S.vphones.forEach(v=>{if(v.no===S.phoneNo&&hasPhone())return;if(v.days>0)out.push({no:v.no,sub:t("vpLeft",{n:v.days}),ok:true});else if(d.phone===v.no&&!(W.mode==="edit"&&W.src.phone===v.no))out.push({no:v.no,sub:t("vpExpired"),ok:false});});
  if(W.mode==="edit"&&W.src.phone&&!out.some(p=>p.no===W.src.phone))out.push({no:W.src.phone,sub:t("vpCurrent"),ok:true});
  if(d.phone&&!out.some(p=>p.no===d.phone))out.push({no:d.phone,sub:t("vpExpired"),ok:false});
  return out;
}
setInterval(()=>{const f=S.cf;if(f&&f.step==="code"&&f.sec>0){f.sec--;if(topScreen().id==="ccode"&&!S.dlg&&!S.sheet)renderPhone();}},1000);

/* ───────────── publish, edit save ───────────── */
function publish(){
  const W=S.w;if(W.pub==="busy")return;
  if(gate().length){W.tried.review=true;render();return;}
  const o=S.nx.publish;S.nx.publish="ok";
  flushSave();
  if(S.net==="off"||o==="offline"){W.pub="offline";render();return;}
  if(o==="error"){W.pub="error";render();return;}
  if(o==="rate"){W.pub="rate";render();return;}
  if(o==="phone"){const v=S.vphones.find(x=>x.no===W.d.phone);if(v)v.days=0;else if(W.d.phone)S.vphones.push({no:W.d.phone,days:0});if(hasPhone()&&W.d.phone===S.phoneNo){W.d.phone="";}W.pub="phone";W.tried[stepKey(steps()[stepIdx("contact")])]=true;render();return;}
  const d=W.d,i=S.drafts.indexOf(d);if(i>=0)S.drafts.splice(i,1);
  const l=Object.assign({},d,{id:"l"+(S.seq++),no:String(100400+S.seq),st:"active",pub:"dToday",views:0,saves:0});
  S.listings.unshift(l);clearTimeout(TM.save);clearTimeout(TM.up);
  S.w=null;S.sheet=S.dlg=S.pk=null;
  S.stack=W.ret.concat([{id:S.v.after==="A"?"listing":"published",lid:l.id}]);
  render();if(S.v.after==="A")toast(t("listingPublished"));
}
function saveEdit(){
  const W=S.w;
  if(gate().length){W.tried.review=true;render();return;}
  const o=S.nx.edit;S.nx.edit="ok";
  if(S.net==="off"||o==="fail"){W.pub="error";render();return;}
  const st=W.src.st;Object.assign(W.src,W.d,{st});closeWz(t("changesSaved"));
}

/* ───────────── my listings actions ───────────── */
function actionsFor(x){
  if(x.draft)return [{k:"continue",l:"actContinue",fn:`resumeDraft('${x.id}')`},{k:"discard",l:"actDiscard",fn:`askAct('delDraft','${x.id}')`,danger:true}];
  const e={k:"edit",l:"actEdit",fn:`startEdit('${x.id}')`},del={k:"delete",l:"actDelete",fn:`askAct('delete','${x.id}')`,danger:true};
  if(x.st==="active")return S.v.exit==="A"?[e,{k:"sold",l:"actSold",fn:`askAct('sold','${x.id}')`},{k:"remove",l:"actRemove",fn:`askAct('archive','${x.id}')`},del]:[e,{k:"remove",l:"actRemove",fn:`S.sheet={t:'exit',id:'${x.id}'};render()`},del];
  if(x.st==="archived")return [{k:"relist",l:"actRelist",fn:`askAct('relist','${x.id}')`},e,del];
  if(x.st==="sold")return [del];
  return [];
}
function askAct(kind,id){S.sheet=null;S.dlg={t:kind,id};render();}
function doAct(){
  const {t:kind,id}=S.dlg;S.dlg=null;
  const o=S.nx.act;S.nx.act="ok";
  if(S.net==="off"||o==="fail"){render();toast(t("actionFailed"));return;}
  if(kind==="delDraft"){S.drafts=S.drafts.filter(d=>d.id!==id);render();toast(t("draftDeleted"));return;}
  const l=S.listings.find(x=>x.id===id);if(!l){render();return;}
  if(kind==="sold"){l.st="sold";render();toast(t("tSold"));}
  if(kind==="archive"){l.st="archived";render();toast(t("tArch"));}
  if(kind==="delete"){S.listings=S.listings.filter(x=>x.id!==id);if(topScreen().id==="listing")S.stack.pop();render();toast(t("tDel"));}

/* ───────────── panel data ───────────── */
const KCD=[
 ["Step 1, VIN as its own first step","drop","VIN becomes an optional field at the bottom of Car. Nothing decodes it (ADR-0053) and today's helper promises auto-fill."],
 ["Brand, Model, Generation, Year","change","Stays, now first. Pickers chain; Year is a list instead of a typed number (both references use a list)."],
 ["Condition, mileage, Damaged, Known issues, optional specs","keep","Same fields and rules (ADR-0052). Optional specs move under a quiet “More details” heading."],
 ["Photos: 1 to 20, compress to ≤5 MB, cover, reorder, retry, remove","keep","Moves from 2nd to 3rd. Every queue state has a visible tile; errors also list under the grid with Retry or Remove."],
 ["Continue on Photos needs one uploaded photo","change","Continue needs one photo picked. Uploads carry on in the background, as PRD 32 says; Publish still waits for them."],
 ["Price, currency, Exchange, Installment","keep","Currency becomes three inline buttons instead of a picker sheet. Switching currency still clears the amount."],
 ["Location: Region, City, area","change","One City picker grouped by region, merged into the Description step."],
 ["Description (required, ≤2000)","keep","Moves next to location."],
 ["Contact phone: free text, unverified","change","Replaced by ADR-0056: quick picks, another number by SMS code, 7-day reuse. Calls and chat switches stay."],
 ["Review with checklist and preview","keep","One list of sections with Change, a card preview, and the publish blockers above the button."],
 ["Header “Cancel” = Discard dialog","change","✕ saves and closes. Delete draft lives in My listings."],
 ["Server autosave, force-save on step change, Retry","keep","“Saved / Saving / Not saved. Retry” under the progress bar."],
 ["Sell entry: latest draft, New listing, My listings","keep","Adds “All drafts” when there are several, and a draft limit."],
 ["My listings: Active, Sold, Archived, Drafts","change","Active · Drafts · Archive (founder, #353). Sold sits in Archive with a label."],
 ["Banned Listing shown in no tab","change","Shown in Active with a “Blocked” label and no actions."],
 ["Edit: wizard opened at Review, identity locked, Save changes","keep","Same shape: a section list, Change, Done, Save changes."],
 ["After publish: toast and Listing detail","keep","The “Share to WhatsApp” CTA in flow 61 is dropped (PR #499: no Share)."],
 ["Inspection sheet after publish","drop","Already removed by ADR-0057."],
 ["Video","drop","Deferred (ADR-0027). States are designed behind D6 option B."],
];
/* ───────────── panel ───────────── */
function seg(items,cur,fn){return `<div class="seg">${items.map(([k,n])=>`<button class="${cur===k?"on":""}" onclick="${fn}('${k}')">${n}</button>`).join("")}</div>`;}
window.pAcct=k=>{baseKeep({acct:k});render();};
window.pDrafts=k=>{baseKeep({dmode:k});render();};
window.pInv=k=>{baseKeep({inv:k});render();};
window.pBlocked=k=>{baseKeep({blocked:k==="yes"});render();};
window.pVp=k=>{S.vp=k;S.vphones=k==="none"?[]:[{no:"+993 65 12-34-56",days:k==="one"?5:0}];render();};
window.pNet=k=>{S.net=k;render();if(k==="on")pump();};
window.pLang=k=>{S.lang=k;render();};window.pTheme=k=>{S.theme=k;render();};
window.pData=k=>{S.data=k;render();};
window.pNx=(a,k)=>{S.nx[a]=k;render();};
window.pDec=(k,o)=>setV(k,o);
const nxSeg=(a,items)=>`<div class="seg">${items.map(([k,n])=>`<button class="${S.nx[a]===k?"on":""}" onclick="pNx('${a}','${k}')">${n}</button>`).join("")}</div>`;
function panel(){
  let h=`<h1>PROTOTYPE — Sell wizard, drafts and My listings</h1><div class="s13" style="color:#555">Throwaway (issue #354). Everything in the phone is clickable; jump buttons set up any state in one click; ← → flip the option of the highlighted decision. Cars, numbers and codes are made up; type any six digits as a code. The resend wait is 15 s here (60 s in the product). Photos are coloured tiles. A ★ is a recommendation, not an approval. New RU and TK wording needs founder review.</div>
  <h2>Seller</h2>${seg([["out","Signed out"],["phone","Phone User"],["email","Email-only User"],["both","Phone + email"]],S.acct,"pAcct")} &nbsp; Drafts ${seg([["0","none"],["1","1"],["3","3"],["5","5 (limit)"]],S.dmode,"pDrafts")}
  <div style="margin-top:6px">Listings ${seg([["some","2 active, 1 sold, 1 removed"],["none","none"]],S.inv,"pInv")} &nbsp; Blocked Listing ${seg([["no","no"],["yes","yes"]],S.blocked?"yes":"no","pBlocked")}</div>
  <div style="margin-top:6px">Extra verified contact phone ${seg([["none","none"],["one","5 days left"],["expired","expired"]],S.vp,"pVp")}</div>
  <h2>Language / theme / network</h2>${seg([["en","EN"],["ru","RU"],["tk","TK"]],S.lang,"pLang")} ${seg([["light","Light"],["dark","Dark"]],S.theme,"pTheme")} ${seg([["on","Online"],["off","Offline"]],S.net,"pNet")} &nbsp; Lists ${seg([["ok","OK"],["loading","Loading"],["error","Error"]],S.data,"pData")}
  <h2>Next result (one-shot, then back to OK)</h2>
  <div class="q">Next photo added ${nxSeg("photo",[["ok","Uploads"],["network","Network error"],["server","Server error"],["rate","Rate limited"],["missing","File missing"],["large","Too large"]])} <button class="jump" onclick="drain()">finish uploads now</button></div>
  <div class="q">Next video (D6 B) ${nxSeg("video",[["ok","Uploads"],["long","Longer than 60 s"],["large","Too large"]])}</div>
  <div class="q">Send code / resend ${nxSeg("send",[["ok","Sent"],["rate","Rate limited"],["rateDay","Daily limit"],["offline","Offline"]])} &nbsp; Code check ${nxSeg("code",[["ok","Accept"],["wrong","Wrong"],["expired","Expired"],["locked","Locked"],["offline","Offline"]])} <button class="jump" onclick="if(S.cf){S.cf.sec=0;render();}">skip the resend wait</button></div>
  <div class="q">Autosave ${nxSeg("save",[["ok","Saves"],["fail","Fails"]])} &nbsp; Publish ${nxSeg("publish",[["ok","Succeeds"],["error","Server error"],["offline","Offline"],["rate","Rate missing"],["phone","Phone rejected"]])}</div>
  <div class="q">Listing action ${nxSeg("act",[["ok","Succeeds"],["fail","Fails"]])} &nbsp; Relist ${nxSeg("relist",[["ok","Allowed"],["phone","Phone must be confirmed"]])} &nbsp; Save edit ${nxSeg("edit",[["ok","Succeeds"],["fail","Fails"]])}</div>
  <h2>Jump to a state</h2>`;
  J.forEach((j,i)=>{h+=j.g?`<div class="grp">${j.g}</div>`:`<span class="jump" onclick="J[${i}].f()">${j.l}</span>`;});
  h+=`<h2>Decisions for the founder (all proposals)</h2>`;
  DKEYS.forEach((k,i)=>{const d=DEC[k],cur=S.v[k];
    h+=`<div class="dec ${S.dec===k?"cur":""}"><div class="ttl">D${i+1}. ${d.name}</div>${Object.entries(d.opts).map(([o,x])=>`<div class="opt ${cur===o?"on":""}"><b>${o}. ${x[0]}</b>${d.rec===o?'<span class="tag rec">★ recommended</span>':""}<br>${x[1]}</div>`).join("")}<div class="why" style="margin:6px 0"><b>Why ${d.rec}:</b> ${d.why}</div>${seg(Object.entries(d.opts).map(([o,x])=>[o,o+" "+x[0]]),cur,`(o=>pDec('${k}',o))`)}<div class="xs" style="color:#777;margin-top:5px">Reference: ${d.ref}</div></div>`;});
  h+=`<h2>Respected, not reopened</h2><div class="q">Five tabs, Sell is a tab (#344). Cabinet has one “My listings” row with a total; tabs are Active · Drafts · Archive, Sold inside Archive; no “List a car” on Cabinet; bottom-sheet pickers; plain rows; Help only where #353 put it (here: one link when the daily code limit is reached). Every contact phone is verified by SMS, no account phone is needed to sell, a verified extra number is reusable for 7 days and never becomes a Sign-in Method (ADR-0056). Codes: 6 digits, 5 minutes, 5 wrong attempts, 5 requests per number per 24 hours, 60 s × 2ⁿ resend wait (ADR-0054). No Share (PR #499). Under review, Rejected and expiry are deferred; publishing goes straight to active. A sold Listing cannot return to active. A blocked Listing has a label and no actions. Brand, model, generation, year and VIN are locked after publishing. Edits stay local until Save changes (ADR-0024).</div>`;
  h+=`<h2>Today's 8 steps: keep, change, drop</h2><table><tr><th>Today</th><th></th><th>In this prototype</th></tr>${KCD.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]}">${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>`;
  h+=`<details ${S.o1?"open":""} ontoggle="S.o1=this.open"><summary>What is built today and what is only planned</summary><div class="q s13">
  <p><b>Built:</b> the 8-step wizard (contracts <code>wizard.ts</code>, mobile <code>wizardMachine.ts</code>), server drafts with autosave and resume, the photo queue (compress to 2400 px JPEG, ≤5 MB, two uploads at a time, two automatic retries, waiting-for-network, lost), publish straight to <code>active</code>, My listings with four tabs, Mark sold, Archive, Republish, Delete, Edit with locked identity fields.</p>
  <p><b>Planned, not built:</b> contact-phone verification (ADR-0056; today the field is free text and publish stores it unchecked), a draft cap, a Listing count for the Cabinet row, the “buyer from AutoTM?” answer on Mark sold, the 14-day auto-archive of sold Listings, a place for a banned Listing in My listings, video (no picker, no compressor, no transcoder).</p>
  <p><b>Source and documents disagree:</b> the draft payload schema still caps <code>currentStep</code> at 7 while the wizard has 8 steps; PRD 32 calls it a 7-step wizard; the photos step blocks Continue until one photo is uploaded although PRD 32 lets the seller continue; flow 61 still lists “Share to WhatsApp” after publishing.</p></div></details>`;
  h+=`<details ${S.o2?"open":""} ontoggle="S.o2=this.open"><summary>Reference captures (viewed locally, not copied)</summary><div class="q s13">
  <p><b>Auto.ru AR-50-002..056.</b> The Sell tab is “Объявления” with one green button. A plate/VIN prelude can be skipped. Then 17 one-question screens with “Шаг N из 17”, back, ✕ and auto-advance: brand, model, year, body, engine, gearbox, modification, colour, photos (step 11, grid with × and a spinner per photo, best-angles or manual order), trim, history (mileage, title, owners, damaged switch), description, phone (several numbers, call hours, chat-only switch), contacts (name, email, city “cannot be changed after publishing”), price with a fair-price hint, VIN last. Then a paid “listing type” screen, “Готово!”, and an edit form that is one long page of collapsible sections with Save. Own listings live on the Sell tab with Edit and Remove from sale.</p>
  <p><b>Kolesa KZ-50-001..039, KZ-51-001..005.</b> A progress bar and “Сохранить и закрыть” on every step: brand, model, year, modification chips on one screen, condition (mileage, customs, damaged switch), price, photos (“Добавлю позже” allowed, “Главное фото”, drag to reorder, gallery or camera sheet), description with option chips and colour, city (popular cities, then regions), contacts with the account phone and “add a number”. Then paid promotion, a document step, and “Спасибо! Объявление на проверке”. Cabinet lists “На сайте” and “В архиве”. Remove from sale asks a reason (sold here, sold elsewhere, changed my mind, other) and moves the Listing to the archive.</p>
  <p><b>Taken:</b> car first; photos mid-flow; chained pickers; a year list; ✕ that keeps the draft; one city list; the phone as its own late step; a reason sheet as option B of D10. <b>Not taken:</b> paid promotion, plate numbers, AI description, price estimate, call hours, moderation wait, documents, 60-day expiry.</p></div></details>`;
  document.getElementById("panel").innerHTML=h;
}
base();render();
</script>
