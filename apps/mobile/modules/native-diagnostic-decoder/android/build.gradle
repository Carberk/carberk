plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'tm.auto.diagnostics'
version = '0.1.0'

android {
  namespace 'tm.auto.diagnostics'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The decoder tests are local JVM tests; keep their JUnit dependency explicit.
  testImplementation 'junit:junit:4.13.2'
}
