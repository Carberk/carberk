packages:
  - "apps/*"
  - "packages/*"

# React Native/Expo needs flat node_modules: Metro expects npm/yarn-style
# hoisting. pnpm 11+ reads this only from here, not from .npmrc.
shamefullyHoist: true

# ADR-0048. pnpm 11+ ignores the `pnpm` field of package.json.
overrides:
  react-native-css-interop: 0.2.4
  # GHSA-qw65-cvwx-89v3 and follow-up 3.x URI fixes. Keep fast-uri 4.x on
  # its existing line; only the vulnerable 3.x dependency edges are pinned.
  "fast-uri@>=3.0.0 <4.0.0": 3.1.9
  # GHSA-p68q-wchp-6fh7 and the 5.x follow-ups. Nest 11 pins an affected
  # Fastify release; remove when the adapter itself depends on Fastify >=5.12.6.
  "@nestjs/platform-fastify@11.2.5>fastify": 5.12.6
  # grpc-js malformed-message, auth-context and handler-error security fixes.
  # Remove when all parents resolve >=1.14.6, including the disclosure follow-up.
  "@grpc/grpc-js@>=1.14.0 <1.14.6": 1.14.6
  # Forge's October/November security fixes, including GHSA-6889-vf6x-f3g5.
  # Remove when every parent resolves node-forge >=1.4.3 without this override.
  node-forge: 1.4.3
  # GHSA-w7jw-789q-3m8p and subsequent shell-quote command-injection fixes.
  # Keep React Native's existing 1.x edge on the patched release.
  shell-quote: 1.12.0
  # xmldom parser/serializer security backports. Preserve the plist callers'
  # existing minor lines; remove when they resolve these versions themselves.
  "@xmldom/xmldom@>=0.8.0 <0.8.15": 0.8.15
  "@xmldom/xmldom@>=0.9.0 <0.9.12": 0.9.12
  # Patched existing major lines; keep every transitive caller on its API.
  "ws@>=7.0.0 <7.5.11": 7.5.11
  "protobufjs@>=7.0.0 <7.6.1": 7.6.1
  "brace-expansion@>=1.0.0 <1.1.20": 1.1.20
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.6
  "brace-expansion@>=3.0.0 <5.0.11": 5.0.11
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "nanoid@>=3.0.0 <3.3.18": 3.3.18
  # Expo's Metro chain needs the patched PostCSS release; the workspace
  # catalog also keeps web/admin on the patched 8.5.18+ type surface.
  "@expo/metro-config@55.0.27>postcss": 8.5.18
  "browserslist@>=4.0.0 <4.28.7": 4.28.7
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "compression@>=1.0.0 <1.8.2": 1.8.2
  # The migration below updates application schemas and the OpenAPI adapter.
  "zod@>=3.0.0 <4.6.7": 4.6.7
  # Metro uses the default Buffer API retained by image-size 2.x.
  "image-size@>=1.0.0 <2.0.3": 2.0.3
  # query-string's CJS caller is adapted by the committed compatibility patch.
  "decode-uri-component@<0.5.1": 0.5.1

# Official Android prefab backports, reviewed separately in PR #859.
patchedDependencies:
  "expo-modules-core@55.0.27": patches/expo-modules-core@55.0.27.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
  "react-native-reanimated@4.2.1": patches/react-native-reanimated@4.2.1.patch

# pnpm 12.11+ links agent skills that dependencies ship into the workspace's
# agent skill directories, such as .claude/skills. ADR-0040 reserves
# .claude/skills for repository skills, so an empty list turns the feature off.
skills:
  dirs: []

# One range for each dependency that two or more workspace packages declare;
# their package.json files say `catalog:`. A package that needs a different
# range declares it directly: mobile's react, react-dom and tailwindcss 3
# follow Expo SDK 55 and NativeWind 4, and packages/db's @nestjs/common is a
# looser peer range.
catalog:
  "@aws-sdk/client-s3": ^3.1048.0
  "@nestjs/bullmq": ^11.0.4
  "@nestjs/cli": ^11.0.21
  "@nestjs/common": ^11.1.16
  "@nestjs/config": ^4.0.0
  "@nestjs/core": ^11.1.16
  "@tailwindcss/postcss": ^4.1.0
  "@testcontainers/postgresql": ^12.2.0
  "@testing-library/react": ^16.3.3
  "@types/node": ^22.20.5
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  bullmq: ^5.76.8
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  eslint: ^9.39.5
  eslint-plugin-react-hooks: 7.1.1
  fastify: 5.12.6
  # happy-dom 21 is out of scope (#854); hold the 20.x line.
  happy-dom: ^20.14.6
  ioredis: ^5.4.2
  nestjs-pino: ^4.3.0
  next: 16.4.1
  postcss: ^8.5.18
  react: ^19.0.0
  react-dom: ^19.0.0
  reflect-metadata: ^0.2.2
  shadcn: ^4.7.0
  sharp: ^0.35.5
  socket.io-client: ^4.8.3
  tailwind-merge: ^2.5.4
  tailwindcss: ^4.1.0
  tsx: ^4.23.15
  tw-animate-css: ^1.4.0
  # TypeScript 7 and 6 side by side (docs/agents/typescript-runtime.md).
  # `tsc` is TypeScript 7, the native compiler, which has no compiler API
  # before 7.1. The `typescript` name stays TypeScript 6, whose only binary
  # is `tsc6`, for typescript-eslint (<6.1), the Nest CLI and Next.js.
  "@typescript/native": npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2
  # Vitest 5 needs vite as a peer. Vite 8 is the newest major in its peer
  # range (^6.4 || ^7 || ^8).
  vite: ^8.3.4
  vitest: ^5.0.4
  zod: ^4.6.7

# Dependency install scripts. pnpm fails the install on any script not listed
# here, so a new one has to be reviewed before it can run.
allowBuilds:
  # Downloads the Prisma schema engine that `prisma migrate` runs, including
  # the API image's migrate pre-deploy as a user that cannot download it later.
  "@prisma/engines": true
  # Checks the Node.js and package manager versions Prisma 7 supports.
  prisma: true
  # Writes Firebase web defaults only when FIREBASE_WEBAPP_CONFIG is set; unused.
  "@firebase/util": false
  # Prints an Open Collective message.
  "@nestjs/core": false
  # Checks that the prebuilt native binding loads; the platform package
  # (@swc/core-<platform>) already provides it.
  "@swc/core": false
  # Optional native speedups for ssh2 (via Testcontainers); ssh2 falls back to JS.
  cpu-features: false
  ssh2: false
  # Validates the binary from the @esbuild/<platform> package, which the JS API
  # and bin shim load directly.
  esbuild: false
  # Looks for the prebuilt @msgpackr-extract/<platform> binary, which loads at
  # runtime without this step; msgpackr falls back to JS without it.
  msgpackr-extract: false
  # Copies the service worker into directories set by `msw.workerDirectory`;
  # no workspace sets it.
  msw: false
  # Only warns when a dependent declares protobufjs with the wrong range prefix.
  protobufjs: false
  # Builds from source only when no prebuilt @img/sharp-<platform> binary
  # matches; every supported target has one.
  sharp: false

minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - typescript-eslint@8.71.2
  - "@vitest/mocker@5.0.4"
  - "@vitest/spy@5.0.4"
  - vitest@5.0.4
